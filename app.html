            ${(b.items || []).map((i) => `<div class="row sp" style="margin-bottom:2px"><span>${esc(i.name)} × ${i.qty}</span><span class="mu">${rs(i.qty * i.price)}</span></div>`).join('')}
          </div>
          <div class="row" style="margin-top:8px;gap:6px">
            <button class="btn s o" style="flex:1" data-a="mobviewbill" data-id="${esc(b.id)}">Details</button>
            <button class="btn s o" style="flex:1" data-a="mobreprintbill" data-id="${esc(b.id)}" data-no="${esc(b.bill_no)}">Reprint</button>
            ${!b.is_void ? `<button class="btn s d" data-a="mobvoidbill" data-id="${esc(b.id)}" data-no="${esc(b.bill_no)}">Void</button>` : ''}
          </div>
        </div>
      `).join('') : `<div class="card mu" style="text-align:center;padding:24px">No bills recorded for this period.</div>`}
    `}
  `
}

function renderMobile() {

  if (!m) return
  if (window.innerWidth > 768) {
    m.style.display = 'none'
    const sh = $('shell')
    if (sh) sh.hidden = false
    return
  }
  const sh = $('shell')
  if (sh) sh.hidden = true
  m.style.display = 'flex'

  const u = (me && me.user) || {}
  const role = getUserRole()
  const rName = (me && me.restaurant && me.restaurant.name) || settingsCache.restaurant_name || 'Restaurant POS'
  const btOk = isBtConnected()
  const subLabel = [u.name, role].filter(Boolean).join(' • ')

  const bodyHtml = mobTab === 'bill' ? renderMobileBilling()
    : mobTab === 'dash' ? renderMobileDashboard()
    : mobTab === 'prods' ? renderMobileProducts()
    : mobTab === 'rep' ? renderMobileReports()
    : renderMobileMore()

  const totals = calcOrderTotals(billCart, billDiscount, settingsCache.tax_percent || 0)

  const navTabs = [

    { id: 'prods', icon: '🍔', label: 'Products', ok: canAccessSection('Products') },
    { id: 'rep', icon: '📑', label: 'Reports', ok: canAccessSection('Reports') },
    { id: 'more', icon: '☰', label: 'More', ok: true }
  ].filter((t) => t.ok)

  m.innerHTML = `
    <header>
      <b>${esc(rName)}<small>${esc(subLabel || (navigator.onLine ? 'Online' : 'Offline'))}</small></b>
      <button class="pill" data-a="mobopensheet" data-t="bt">

// Live input, focus & commit handlers scoped cleanly so focus/scroll are NEVER wiped
document.addEventListener('focusin', (e) => {
  if (e.target && e.target.dataset && e.target.dataset.mobqtyUid !== undefined) {
    try { e.target.select() } catch {}
  }
})

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target && e.target.dataset && e.target.dataset.mobqtyUid !== undefined) {
    e.preventDefault()
    commitMobQty(e.target.dataset.mobqtyUid, e.target.value)
    e.target.blur()
  }
})

document.addEventListener('focusout', (e) => {
  if (e.target && e.target.dataset && e.target.dataset.mobqtyUid !== undefined) {
    commitMobQty(e.target.dataset.mobqtyUid, e.target.value)
  }
})

document.addEventListener('input', (e) => {
  const id = e.target.id
  if (e.target && e.target.dataset && e.target.dataset.mobqtyUid !== undefined) {
    const cleaned = e.target.value.replace(/\D/g, '')
    if (e.target.value !== cleaned) e.target.value = cleaned
    return
  }
  if (id === 'mobSearchInp') {
    mobQuery = e.target.value
    const listEl = $('mobBillList')
    if (listEl) listEl.innerHTML = mobBillListHtml()
  } else if (id === 'mobProdSearchInp') {
    mobProdSearch = e.target.value
    const curCat = (catalog.categories || []).find((c) => String(c.id) === String(mobProdCat))
    const listEl = $('mobProdList')
    if (curCat && listEl) listEl.innerHTML = mobProdItemsHtml(curCat)
  } else if (id === 'mobDiscInp') {
    billDiscount = Math.max(0, Number(e.target.value) || 0)
    updateMobCartSheetTotalsDom()
    updateMobCartBarDom()
  } else if (id === 'mobCashSplitInp') {
    const t = calcOrderTotals(billCart, billDiscount, settingsCache.tax_percent || 0)
    billCashAmount = Math.max(0, Number(e.target.value) || 0)
    billOnlineAmount = Math.max(0, Math.round((t.total - billCashAmount) * 100) / 100)
    const ol = $('mobOnlineSplitInp')
    if (ol) ol.value = billOnlineAmount
  } else if (id === 'mobOnlineSplitInp') {
    const t = calcOrderTotals(billCart, billDiscount, settingsCache.tax_percent || 0)
    billOnlineAmount = Math.max(0, Number(e.target.value) || 0)
    billCashAmount = Math.max(0, Math.round((t.total - billOnlineAmount) * 100) / 100)
    const ca = $('mobCashSplitInp')
    if (ca) ca.value = billCashAmount
  } else if (id === 'mobNoteText') {
    mobNoteDraft = e.target.value
  }
})

document.addEventListener('change', async (e) => {
  const id = e.target.id
  if (id === 'mobWaiterSel') {
    billWaiter = e.target.value
  } else if (id === 'mobPaySel') {
    billPayment = e.target.value
    if (billPayment === 'Split') {
      const t = calcOrderTotals(billCart, billDiscount, settingsCache.tax_percent || 0)
      billCashAmount = Math.round(t.total / 2)
      billOnlineAmount = Math.max(0, Math.round((t.total - billCashAmount) * 100) / 100)
    }
    syncMobSheetOverlayDom()
  } else if (id === 'mobBtWidthSel') {
    btPrinterWidth = e.target.value
    lsSet('bt_printer_width', btPrinterWidth)
  } else if (id === 'mobRepFrom') {
    mobCustomFrom = e.target.value
  } else if (id === 'mobRepTo') {
    mobCustomTo = e.target.value
  } else if (id === 'mpFile' && e.target.files && e.target.files[0]) {
    mobSyncProdDraftFromDom()
    mobDraft.image = await resizeImage(e.target.files[0])
    renderMobile()
  }
})

function mobSyncProdDraftFromDom() {
  if (!mobDraft) return
  if ($('mpName')) mobDraft.name = $('mpName').value.trim()
  if ($('mpCat')) mobDraft.category_id = $('mpCat').value
  if ($('mpTrack')) mobDraft.track_stock = !!$('mpTrack').checked
  const rows = Array.from(document.querySelectorAll('.mp-var-row'))
  if (rows.length) {
    mobDraft.variants = rows.map((row, idx) => {
      const prev = mobDraft.variants[idx] || {}
      return {
        id: prev.id || '',
        name: row.querySelector('.mp-vn') ? row.querySelector('.mp-vn').value.trim() : prev.name || '',
        price: row.querySelector('.mp-vp') ? row.querySelector('.mp-vp').value : prev.price || '',
        stock: row.querySelector('.mp-vs') ? Math.max(0, parseInt(row.querySelector('.mp-vs').value, 10) || 0) : (prev.stock ?? 0),
        min_stock: row.querySelector('.mp-vms') ? Math.max(0, parseInt(row.querySelector('.mp-vms').value, 10) || 0) : (prev.min_stock ?? 5)
      }
    })
  }
}

      image: '',
      track_stock: false,
      variants: [{ id: '', name: '', price: '', stock: 0, min_stock: 5 }]
    }
    mobSheet = { t: 'prod' }
    renderMobile()
  },
  mobeditprod: (d) => {
    const p = (catalog.products || []).find((x) => String(x.id) === String(d.id))
    if (!p) return
    mobDraft = {
      id: p.id,
      name: p.name,
      category_id: p.category_id,
      image: p.image || '',
      track_stock: !!p.track_stock,
      variants: (p.variants || []).map((v) => ({
        id: v.id,
        name: v.name || '',
        price: v.price ?? '',
        stock: v.stock ?? 0,
        min_stock: v.min_stock ?? 5
      }))
    }
    mobSheet = { t: 'prod' }
    renderMobile()
  },
  mobprodtgltrack: () => {
    mobSyncProdDraftFromDom()
    renderMobile()
  },
  mobprodaddvar: () => {
    mobSyncProdDraftFromDom()
    mobDraft.variants.push({ id: '', name: '', price: '', stock: 0, min_stock: 5 })
    renderMobile()
  },
  mobprodrmvar: (d) => {
    mobSyncProdDraftFromDom()
    mobDraft.variants.splice(parseInt(d.i, 10), 1)
    renderMobile()
  },
  mobsaveprod: async () => {
    mobSyncProdDraftFromDom()
    if (!mobDraft.name) return showMobToast('Product name is required')
    const payload = {
      id: mobDraft.id || '',
      name: mobDraft.name,
      category_id: mobDraft.category_id,
      track_stock: !!mobDraft.track_stock,
      stock: mobDraft.track_stock ? mobDraft.variants.reduce((s, v) => s + Number(v.stock || 0), 0) : 0,
      min_stock: mobDraft.variants.length ? Math.min(...mobDraft.variants.map((v) => Number(v.min_stock ?? 5))) : 5,
      variants: mobDraft.variants.map((v) => ({
        id: v.id || '',
        name: v.name || '',
        price: Number(v.price || 0),
        stock: Number(v.stock || 0),
        min_stock: Number(v.min_stock ?? 5)
      }))
    }
    if (mobDraft.image && String(mobDraft.image).startsWith('/api/product-image/')) {
      payload.keep_existing_image = true
      payload.image = '__KEEP__'
    } else {
      payload.image = mobDraft.image || ''
    }
    const r = await api('/api/products', payload)
    if (r && r.ok) {
      mobSheet = null
      mobDraft = null
      await loadCatalog()
      showMobToast('Product saved')
      renderMobile()
    } else {
      showMobToast((r && r.message) || 'Could not save product')
    }
  },
  mobdelprod: async (d) => {
    if (!confirm(`Delete product "${d.name}"?`)) return
    const r = await api('/api/products/' + d.id, undefined, 'DELETE')
    if (r && r.ok) {
      await loadCatalog()
      showMobToast('Product deleted')
      renderMobile()
    } else {
      showMobToast((r && r.message) || 'Delete failed')
    }
  },
  mobsetperiod: (d) => {
    mobPer = d.p
    if (mobPer !== 'Custom') loadMobileReports()
    else renderMobile()
  },
  mobapplycustomrep: () => { loadMobileReports() },
  mobexportcsv: () => { exportMobileCsv() },
  mobviewbill: async (d) => {
    const cached = mobReportsData && (mobReportsData.bills || []).find((b) => String(b.id) === String(d.id))
    if (cached) {
      mobBillDetail = cached
      mobSheet = { t: 'billdetail' }
      return renderMobile()
    }
    const r = await api('/api/orders/' + encodeURIComponent(d.id))
    if (r && r.ok && r.bill) {
      mobBillDetail = r.bill
      mobSheet = { t: 'billdetail' }
      renderMobile()
    } else {
      showMobToast('Could not load bill details')
    }
  },
  mobreprintbill: (d) => mobReprintBillById(d.id, d.no),
  mobvoidbill: async (d) => {
    if (!confirm(`VOID Bill #${pad(d.no)}? This will also restore product stock.`)) return
    const r = await api('/api/orders/' + encodeURIComponent(d.id), undefined, 'DELETE')
    if (r && r.ok) {
      mobSheet = null
      showMobToast(`Bill #${pad(d.no)} voided`)
      await Promise.all([loadMobileReports(), loadCatalog()])
      renderMobile()
    } else {
      showMobToast((r && r.message) || 'Could not void bill')
    }
  },
  mobopensheet: async (d) => {
    if (d.t === 'staff') {
      const r = await api('/api/users')
      mobUsersList = (r && r.ok && r.users) || []
    } else if (d.t === 'waiters') {
      const r = await api('/api/waiters')
      if (r && r.ok) waitersList = r.waiters || []
    } else if (d.t === 'tables') {
      await loadTables()
    } else if (d.t === 'rest') {
      const r = await api('/api/settings')
      if (r && r.ok && r.settings) settingsCache = r.settings
    } else if (d.t === 'bt' && hasNativeAndroidBt()) {
      scanAndroidBtDevices()
    }
    mobSheet = { t: d.t }
    syncMobSheetOverlayDom()
  },
  mobclosesheet: () => {
    mobSheet = null
    syncMobSheetOverlayDom()
  },
  mobbtscan: () => {
    const res = scanAndroidBtDevices()
    if (!res.ok && res.message) showMobToast(res.message)
    renderMobile()
  },
  mobbtpair: async (d) => {
    showMobToast('Connecting to ' + (d.name || 'printer') + '...')
    const res = await connectAndroidBtDevice(d.addr)
    if (res && res.ok) showMobToast('Connected to ' + btPrinterName)
    else showMobToast((res && res.message) || 'Failed to connect printer')
    renderMobile()
  },
  mobsystemtestprint: () => {
    printBillNow({
      bill_no: 1,
      order_type: 'Test Slip',
      created_at: new Date().toLocaleString(),
      subtotal: 100,
      discount: 0,
      tax: 0,
      total: 100,
      payment_method: 'Cash',
      items: [{ name: 'Test Thermal Print', qty: 1, price: 100 }]
    })
  },
  mobsubmitaddstaff: async () => {
    const name = ($('ms_name') ? $('ms_name').value : '').trim()
    const username = ($('ms_user') ? $('ms_user').value : '').trim()
    const role = $('ms_role') ? $('ms_role').value : 'cashier'
    const password = $('ms_pw') ? $('ms_pw').value : ''
    if (!name || !username || password.length < 6) return showMobToast('Enter name, username, and password (6+ chars)')
    const r = await api('/api/users', { name, username, role, password })
    if (r && r.ok) {
      const listRes = await api('/api/users')
      mobUsersList = (listRes && listRes.ok && listRes.users) || mobUsersList
      showMobToast('Staff account created')
      renderMobile()
    } else {
      showMobToast((r && r.message) || 'Failed to add user')
    }
  },
  mobeditstaffopen: (d) => {
    mobSheet = { t: 'editstaff', id: d.id }
    renderMobile()
  },
  mobsaveeditstaff: async (d) => {
    const name = ($('mes_name') ? $('mes_name').value : '').trim()
    const username = ($('mes_user') ? $('mes_user').value : '').trim()
    const role = $('mes_role') ? $('mes_role').value : 'cashier'
    if (!name || !username) return showMobToast('Name and username required')
    const r = await api(`/api/users/${d.id}`, { name, username, role }, 'PUT')
    if (r && r.ok) {
      const listRes = await api('/api/users')
      mobUsersList = (listRes && listRes.ok && listRes.users) || mobUsersList
      mobSheet = { t: 'staff' }
      showMobToast('Staff updated')
      renderMobile()
    } else {
      showMobToast((r && r.message) || 'Update failed')
    }
  },
  mobtglstaff: async (d) => {
    const act = d.act === '1'
    if (!act && !confirm('Block this staff account from logging in?')) return
    const r = await api(`/api/users/${d.id}/status`, { is_active: act }, 'PUT')
    if (r && r.ok) {
      const listRes = await api('/api/users')
      mobUsersList = (listRes && listRes.ok && listRes.users) || mobUsersList
      showMobToast(act ? 'Account activated' : 'Account blocked')
      renderMobile()
    } else {
      showMobToast((r && r.message) || 'Action failed')
    }
  },
  mobpwstaffopen: (d) => {
    mobSheet = { t: 'pwstaff', id: d.id, name: d.name }
    renderMobile()
  },
  mobsavepwstaff: async (d) => {
    const password = $('mpw_new') ? $('mpw_new').value : ''
    if (password.length < 6) return showMobToast('Password must be 6+ characters')
    const r = await api(`/api/users/${d.id}/password`, { password }, 'PUT')
    if (r && r.ok) {
      mobSheet = { t: 'staff' }
      showMobToast('Password reset')
      renderMobile()
    } else {
      showMobToast((r && r.message) || 'Failed to reset password')
    }
  },
  mobdelstaff: async (d) => {
    if (!confirm(`Delete staff user "${d.name}"?`)) return
    const r = await api(`/api/users/${d.id}`, undefined, 'DELETE')
    if (r && r.ok) {
      const listRes = await api('/api/users')
      mobUsersList = (listRes && listRes.ok && listRes.users) || mobUsersList
      showMobToast('Staff removed')
      renderMobile()
    } else {
      showMobToast((r && r.message) || 'Delete failed')
    }
  },
  mobaddwaiter: async () => {
    const name = ($('mw_name') ? $('mw_name').value : '').trim()
    if (!name) return showMobToast('Enter waiter name')
    const r = await api('/api/waiters', { name })
    if (r && r.ok) {
      const wr = await api('/api/waiters')
      if (wr && wr.ok) waitersList = wr.waiters || []
      showMobToast('Waiter added')
      renderMobile()
    } else {
      showMobToast((r && r.message) || 'Failed to add waiter')
    }
  },
  mobrenwaiter: async (d) => {
    const name = prompt('Rename waiter:', d.name)
    if (!name || !name.trim() || name.trim() === d.name) return
    const r = await api('/api/waiters/' + d.id, { name: name.trim() }, 'PUT')
    if (r && r.ok) {
      const wr = await api('/api/waiters')
      if (wr && wr.ok) waitersList = wr.waiters || []
      showMobToast('Waiter renamed')
      renderMobile()
    } else {
      showMobToast((r && r.message) || 'Rename failed')
    }
  },
  mobdelwaiter: async (d) => {
    if (!confirm(`Delete waiter "${d.name}"?`)) return
    const r = await api('/api/waiters/' + d.id, undefined, 'DELETE')
    if (r && r.ok) {
      const wr = await api('/api/waiters')
      if (wr && wr.ok) waitersList = wr.waiters || []
      showMobToast('Waiter deleted')
      renderMobile()
    } else {
      showMobToast((r && r.message) || 'Delete failed')
    }
  },
  mobaddtable: async () => {
    const name = ($('mt_name') ? $('mt_name').value : '').trim()
    if (!name) return showMobToast('Enter table name')
    const r = await api('/api/tables', { name })
    if (r && r.ok) {
      await loadTables()
      showMobToast('Table added')
      renderMobile()
    } else {
      showMobToast((r && r.message) || 'Failed to add table')
    }
  },
  mobrentable: async (d) => {
    const name = prompt('Rename table:', d.name)
    if (!name || !name.trim() || name.trim() === d.name) return
    const r = await api('/api/tables/' + d.id, { name: name.trim() }, 'PUT')
    if (r && r.ok) {
      await loadTables()
      showMobToast('Table renamed')
      renderMobile()
    } else {
      showMobToast((r && r.message) || 'Rename failed')
    }
  },
  mobdeltable: async (d) => {
    if (!confirm(`Delete table "${d.name}"?`)) return
    const r = await api('/api/tables/' + d.id, undefined, 'DELETE')
    if (r && r.ok) {
      await loadTables()
      showMobToast('Table deleted')
      renderMobile()
    } else {
      showMobToast((r && r.message) || 'Delete failed')
    }
  },
  mobsavegeneral: async () => {
    const body = {
      restaurant_name: ($('mr_name') ? $('mr_name').value : '').trim(),
      phone: ($('mr_phone') ? $('mr_phone').value : '').trim(),
      address: ($('mr_addr') ? $('mr_addr').value : '').trim(),
      tax_percent: Number($('mr_tax') ? $('mr_tax').value : 0) || 0,
      footer: ($('mr_foot') ? $('mr_foot').value : '').trim()
    }
    const r = await api('/api/settings', body)
    if (r && r.ok) {
      settingsCache = { ...settingsCache, ...body }
      if (me && me.restaurant && body.restaurant_name) me.restaurant.name = body.restaurant_name
      mobSheet = null
      showMobToast('Settings saved')
      renderMobile()
    } else {
      showMobToast((r && r.message) || 'Failed to save settings')
    }
  },
  mobchangemypw: async () => {
    const old_password = $('mpw_old') ? $('mpw_old').value : ''
    const new_password = $('mpw_next') ? $('mpw_next').value : ''
    if (!old_password || new_password.length < 6) return showMobToast('Enter current password and new password (6+ chars)')
    const r = await api('/api/account/password', { old_password, new_password })
    if (r && r.ok) {
      mobSheet = null
      showMobToast('Password changed successfully')
      renderMobile()
    } else {
      showMobToast((r && r.message) || 'Password update failed')
    }
  },
  mobtoggledark: () => {
    const cur = document.documentElement.getAttribute('data-theme')
    const sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
    const isDark = cur === 'dark' || (!cur && sysDark)
    const next = isDark ? 'light' : 'dark'
    document.documentElement.setAttribute('data-theme', next)
    lsSet('mob_theme', next)
    renderMobile()
  },
  moblogout: () => leave()
})

// CRITICAL FIX FOR ANDROID SOFT KEYBOARD (BUG 5):
// Only switch between desktop/mobile when crossing the 768px breakpoint,
// NEVER when soft keyboard shrinks window height on Android Chrome!
window.addEventListener('resize', () => {
  const isMobNow = window.innerWidth <= 768
  if (isMobNow === mobLastIsMobile) return
  mobLastIsMobile = isMobNow
  if (isMobNow) {
    renderMobile()
  } else {
    const mobApp = $('mobApp')
    if (mobApp) mobApp.style.display = 'none'
    const shell = $('shell')
    if (shell) shell.hidden = false
    go(getAllowedNav().includes(page) ? page : 'Billing')
  }
})

init()

</script>
</body>
</html>
