<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Restaurant POS - Portal</title>
<link rel="icon" href="/favicon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#191612">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #F8F6F0;
    color: #1F1B16;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font-family: inherit; }

  #banner {
    background: #92400E;
    color: #fff;
    padding: 10px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex: none;
    font-size: 14px;
  }
  #banner button {
    min-height: 34px;
    border: 1px solid #fff;
    background: transparent;
    color: #fff;
    border-radius: 8px;
    padding: 0 12px;
    cursor: pointer;
    font-weight: 600;
  }

  /* Desktop layout */
  .shell { flex: 1; min-height: 0; display: flex; }
  .side {
    width: 220px;
    background: #191612;
    padding: 24px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: none;
    box-shadow: 2px 0 8px rgba(0,0,0,0.12);
  }
  .brand { color: #F8F6F0; font-weight: 800; font-size: 18px; padding: 0 10px 4px; }
  .rname { color: #D6D3D1; font-size: 13px; padding: 0 10px 18px; word-break: break-word; }
  .nav {
    text-align: left;
    border: 0;
    border-radius: 10px;
    padding: 12px 14px;
    min-height: 44px;
    font-size: 15px;
    cursor: pointer;
    background: transparent;
    color: #D6D3D1;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: all .15s;
  }
  .nav:hover { background: rgba(255,255,255,0.06); color: #fff; }
  .nav.on { background: #9A3412; color: #fff; font-weight: 700; box-shadow: 0 2px 6px rgba(154,52,18,0.3); }
  .pc-btn {
    background: #9A3412 !important;
    color: #fff !important;
    font-weight: 700 !important;
    margin-top: auto !important;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-radius: 10px;
    cursor: pointer;
    border: 0;
    box-shadow: 0 2px 6px rgba(154,52,18,0.3);
  }
  .out {
    background: transparent;
    border: 1px solid #57534E;
    color: #F8F6F0;
    border-radius: 8px;
    padding: 10px 14px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    margin-top: 10px;
    transition: background .15s;
  }
  .out:hover { background: #292524; }

  /* Mobile Elements (Hidden on Desktop) */
  .mob-header { display: none; }
  .mob-nav { display: none; }

  main { flex: 1; overflow-y: auto; overflow-x: hidden; min-width: 0; }
  .pad { padding: 28px; display: grid; gap: 18px; align-content: start; max-width: 1200px; margin: 0 auto; }
  h2 { margin: 0; font-size: 22px; font-weight: 800; color: #1C1917; }
  h3 { margin: 0; font-size: 18px; font-weight: 700; color: #1C1917; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .top { align-items: flex-start; }
  .grow1 { flex: 1; min-width: 260px; }
  .grow2 { flex: 1.5; min-width: 300px; }
  .card {
    background: #ffffff;
    border: 1px solid #EBE4D8;
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.03);
  }
  .kpi {
    background: #ffffff;
    border: 1px solid #EBE4D8;
    border-radius: 14px;
    padding: 18px;
    flex: 1;
    min-width: 160px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.03);
  }
  .kpi span { color: #78716C; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .kpi b { display: block; font-size: 26px; margin-top: 4px; font-weight: 800; color: #1C1917; }
  .muted { color: #78716C; font-size: 14px; }
  .err { color: #DC2626; font-size: 14px; }
  .ok { color: #166534; font-size: 14px; }
  .btn {
    min-height: 40px;
    border: 1px solid #D6CEBE;
    background: #fff;
    border-radius: 8px;
    padding: 0 14px;
    color: #1F1B16;
    cursor: pointer;
    font-size: 14px;
    display: inline-flex;
    align-items: center;
    font-weight: 500;
  }
  .btn.red { color: #DC2626; border-color: #FECACA; background: #FEF2F2; }
  .pri {
    min-height: 44px;
    border: 0;
    border-radius: 10px;
    padding: 0 20px;
    background: #9A3412;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(154,52,18,0.25);
  }
  .inp {
    min-height: 44px;
    border: 1px solid #D6CEBE;
    border-radius: 10px;
    padding: 0 12px;
    font-size: 15px;
    background: #fff;
    color: #1F1B16;
    outline: none;
  }
  .inp:focus {
    border-color: #9A3412;
    box-shadow: 0 0 0 3px rgba(154, 52, 18, 0.15);
  }
  label.f { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 14px; }
  .bar { display: flex; align-items: center; gap: 12px; margin: 12px 0; }
  .bar .n { width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
  .bar .t { flex: 1; height: 14px; background: #EFE8DA; border-radius: 7px; }
  .bar .t i { display: block; height: 14px; background: #9A3412; border-radius: 7px; }
  .bar .q { width: 44px; text-align: right; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  .catcard {
    text-align: left;
    background: #fff;
    border: 1px solid #EBE4D8;
    border-radius: 14px;
    padding: 20px;
    min-height: 140px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 6px;
    color: #1F1B16;
  }
  .catcard b { font-size: 18px; }
  .thumbs { display: flex; gap: 6px; margin-top: auto; }
  .thumbs img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; }
  .prod { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid #EFE8DA; }
  .prod img, .ph { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; flex: none; }
  .ph { background: #E7DFD0; color: #78716C; font-size: 11px; display: flex; align-items: center; justify-content: center; }
  .chip { background: #F3EBDD; border-radius: 14px; padding: 4px 10px; font-size: 13px; display: inline-block; margin: 6px 6px 0 0; }
  .tabs { display: inline-flex; gap: 4px; background: #fff; border: 1px solid #EBE4D8; border-radius: 12px; padding: 4px; }
  .tabs button { min-height: 40px; padding: 0 16px; border: 0; border-radius: 10px; font-size: 14px; cursor: pointer; font-weight: 600; background: transparent; color: #1F1B16; }
  .tabs button.on { background: #9A3412; color: #fff; }
  .ctl { display: flex; align-items: center; gap: 8px; font-size: 14px; flex-wrap: wrap; }
  .bill { display: flex; gap: 14px; padding: 14px 0; border-top: 1px solid #EFE8DA; flex-wrap: wrap; }
  .bill .l { width: 160px; flex: none; }
  .bill .m { flex: 1; min-width: 200px; }
  .bill .r { width: 130px; text-align: right; flex: none; }
  .li { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; font-size: 14px; }
  .pay { display: flex; justify-content: space-between; padding: 12px 0; border-top: 1px solid #EFE8DA; font-size: 15px; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .mbox { background: #fff; border-radius: 16px; width: 540px; max-width: 100%; max-height: 90vh; overflow-y: auto; padding: 26px; display: grid; gap: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
  .vrow { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  .vrow .vn { flex: 1; min-width: 0; }
  .vrow .vp { width: 95px; }
  .vrow .vs { width: 85px; }
  .vrow .vms { width: 75px; }
  .photo { display: flex; align-items: center; gap: 12px; }
  .photo img, .photo .ph { width: 72px; height: 72px; }
  .mrow { display: flex; gap: 10px; }
  .mrow .pri { flex: 1; }
  .lic { padding: 12px 16px; border-radius: 10px; font-size: 14px; }

    /* Bluetooth & Native Mobile App UI */
  .mob-bt-btn {
    background: #292524 !important;
    border: 1px solid #44403C !important;
    color: #38BDF8 !important;
    border-radius: 8px !important;
    padding: 5px 9px !important;
    font-size: 11.5px !important;
    font-weight: 700 !important;
    cursor: pointer !important;
    display: inline-flex !important;
    align-items: center !important;
    gap: 4px !important;
  }
  .mob-bt-btn.connected {
    background: #064E3B !important;
    border-color: #059669 !important;
    color: #34D399 !important;
  }
  .pos-top-action-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #ffffff;
    border: 1px solid #EBE4D8;
    border-radius: 14px;
    padding: 6px 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.03);
    margin-bottom: 2px;
  }
  .pos-table-badge-btn {
    height: 38px !important;
    min-height: 38px !important;
    padding: 0 12px !important;
    border-radius: 10px !important;
    background: #FAF6F0 !important;
    border: 1.5px solid #D6CEBE !important;
    color: #1F1B16 !important;
    display: inline-flex !important;
    align-items: center !important;
    gap: 6px !important;
    cursor: pointer !important;
    flex: none !important;
    white-space: nowrap !important;
    font-weight: 800 !important;
    font-size: 13.5px !important;
    transition: all .15s !important;
  }
  .pos-table-badge-btn:active {
    background: #EFE8DA !important;
    transform: scale(0.97) !important;
  }
  .pos-top-search {
    width: 100%;
    height: 38px;
    min-height: 38px;
    border: 0;
    background: transparent;
    padding: 0 6px;
    font-size: 14px;
    color: #1F1B16;
    outline: none;
    font-family: inherit;
  }
  .pos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
  }
  @media (max-width: 768px) {
    .pos-grid {
      grid-template-columns: repeat(2, 1fr) !important;
      gap: 10px !important;
    }
  }
  .pos-card {
    background: #ffffff !important;
    border: 1px solid #E8E0D5 !important;
    border-radius: 16px !important;
    overflow: hidden !important;
    display: flex !important;
    flex-direction: column !important;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04) !important;
    transition: transform .12s, box-shadow .12s !important;
    position: relative !important;
    user-select: none !important;
  }
  .pos-card:active {
    transform: scale(0.97) !important;
  }
  .pos-card.in-cart {
    border-color: #9A3412 !important;
    box-shadow: 0 0 0 1.5px #9A3412, 0 3px 10px rgba(154,52,18,0.15) !important;
  }
  .pos-card-img-wrap {
    width: 100% !important;
    height: 125px !important;
    position: relative !important;
    background: #F7F3EA !important;
    overflow: hidden !important;
  }
  .pos-card img {
    width: 100% !important;
    height: 125px !important;
    object-fit: cover !important;
    display: block !important;
    transition: transform .2s ease !important;
  }
  .pos-card-img-ph {
    width: 100% !important;
    height: 125px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    font-size: 42px !important;
    background: #F3ECE1 !important;
  }
  .pos-card-body {
    padding: 10px 10px 12px !important;
    display: flex !important;
    flex-direction: column !important;
    gap: 4px !important;
    flex: 1 !important;
  }
  .pos-card-title {
    font-weight: 700 !important;
    font-size: 13.5px !important;
    color: #1C1917 !important;
    line-height: 1.35 !important;
    min-height: 36px !important;
    display: -webkit-box !important;
    -webkit-line-clamp: 2 !important;
    -webkit-box-orient: vertical !important;
    overflow: hidden !important;
  }
  .pos-card-footer {
    display: flex !important;
    align-items: center !important;
    justify-content: space-between !important;
    margin-top: auto !important;
    padding-top: 4px !important;
  }
  .pos-card-price {
    font-weight: 900 !important;
    font-size: 15px !important;
    color: #9A3412 !important;
  }
  .pos-card-add-btn {
    width: 36px !important;
    height: 36px !important;
    min-height: 36px !important;
    padding: 0 !important;
    border-radius: 50% !important;
    background: #9A3412 !important;
    color: #ffffff !important;
    border: 0 !important;
    font-size: 20px !important;
    font-weight: 800 !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    cursor: pointer !important;
    box-shadow: 0 3px 8px rgba(154,52,18,0.4) !important;
    transition: transform .1s, background .15s !important;
  }
  .pos-card-add-btn:active {
    transform: scale(0.9) !important;
    background: #7C2D12 !important;
  }
  .mob-cart-bar {
    display: none;
    position: fixed;
    bottom: 64px;
    left: 12px;
    right: 12px;
    background: #181512;
    color: #fff;
    border-radius: 16px;
    padding: 11px 18px;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    z-index: 45;
    cursor: pointer;
    border: 1px solid #38332B;
    animation: slideUp .2s ease-out;
  }
  .mob-cart-bar.active { display: flex !important; }

  /* Network status pill */
  .net-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 12px;
    background: #064E3B;
    color: #34D399;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: all .2s;
  }
  .net-badge.offline {
    background: #78350F;
    color: #FCD34D;
  }

    /* Top Action Bar for Clean Mobile Billing */
  .pos-top-action-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #ffffff;
    border: 1px solid #EBE4D8;
    border-radius: 12px;
    padding: 6px 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.03);
  }
  .pos-table-badge-btn {
    height: 36px !important;
    min-height: 36px !important;
    padding: 0 12px !important;
    border-radius: 8px !important;
    background: #FAF6F0 !important;
    border: 1px solid #D6CEBE !important;
    color: #1F1B16 !important;
    display: inline-flex !important;
    align-items: center !important;
    gap: 6px !important;
    cursor: pointer !important;
    flex: none !important;
    white-space: nowrap !important;
    font-weight: 700 !important;
    font-size: 13px !important;
  }
  .pos-top-search {
    width: 100%;
    height: 36px;
    min-height: 36px;
    border: 0;
    background: transparent;
    padding: 0 6px;
    font-size: 13.5px;
    color: #1F1B16;
    outline: none;
  }
  .pos-card-add-btn {
    width: 34px !important;
    height: 34px !important;
    min-height: 34px !important;
    padding: 0 !important;
    border-radius: 50% !important;
    background: #9A3412 !important;
    color: #ffffff !important;
    border: 0 !important;
    font-size: 20px !important;
    font-weight: 800 !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    cursor: pointer !important;
    box-shadow: 0 3px 8px rgba(154,52,18,0.4) !important;
    transition: transform .1s, background .15s !important;
  }
  .pos-card-add-btn:active {
    transform: scale(0.9) !important;
    background: #7c2d12 !important;
  }

  /* Segmented order-type selector */
  .pos-type-bar {
    display: flex;
    background: #EFE8DA;
    padding: 3px;
    border-radius: 10px;
    gap: 4px;
    width: 100%;
  }
  .pos-type-pill {
    flex: 1;
    border: 0;
    background: transparent;
    padding: 8px 4px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    color: #57534E;
    cursor: pointer;
    text-align: center;
    transition: all .15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .pos-type-pill.on {
    background: #9A3412;
    color: #fff;
    box-shadow: 0 2px 4px rgba(154,52,18,0.25);
  }

  /* Horizontal table chips scroller */
  .table-scroll {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 2px 0 6px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .table-scroll::-webkit-scrollbar { display: none; }
  .table-chip {
    flex: none;
    height: 34px;
    padding: 0 12px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 700;
    border: 1px solid #D6CEBE;
    background: #fff;
    color: #1F1B16;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
  }
  .table-chip.on {
    background: #9A3412;
    color: #fff;
    border-color: #9A3412;
    box-shadow: 0 2px 4px rgba(154,52,18,0.25);
  }
  .table-chip.occupied {
    background: #FEE2E2;
    color: #991B1B;
    border-color: #FCA5A5;
  }

  /* Product card & components */
  .pos-card-img-wrap {
    width: 100%;
    height: 105px;
    position: relative;
    background: #F4EFE6;
    overflow: hidden;
    border-radius: 8px;
  }
  .pos-card-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .pos-card-img-ph {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    background: #EDE6D8;
  }
  .pos-card-body {
    padding: 2px 0 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
  }
  .pos-card-title {
    font-weight: 700;
    font-size: 13px;
    color: #1C1917;
    line-height: 1.3;
    min-height: 34px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .pos-card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: auto;
    gap: 4px;
  }
  .pos-card-price {
    font-weight: 800;
    font-size: 14px;
    color: #9A3412;
  }
  .pos-card-add-btn {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: #9A3412;
    color: #fff;
    border: 0;
    font-size: 18px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex: none;
    box-shadow: 0 2px 5px rgba(154,52,18,0.28);
    transition: transform .1s;
  }
  .pos-card-add-btn:active {
    transform: scale(0.92);
  }

  /* Settings 3-tabs bar */
  .settings-tabs-bar {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    border-bottom: 1px solid #E6DED0;
    margin-bottom: 18px;
    scrollbar-width: none;
  }
  .settings-tabs-bar::-webkit-scrollbar { display: none; }
  .settings-tab-btn {
    min-height: 42px;
    border: 1px solid #D6CEBE;
    background: #fff;
    color: #1F1B16;
    border-radius: 10px;
    padding: 0 16px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all .15s;
  }
  .settings-tab-btn.on {
    background: #9A3412;
    color: #fff;
    border-color: #9A3412;
    box-shadow: 0 2px 6px rgba(154,52,18,0.25);
  }

  /* ================= RESPONSIVE MOBILE STYLES ================= */
  @media (max-width: 768px) {
    .side { display: none !important; }
    .mob-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #191612;
      color: #fff;
      padding: 10px 14px;
      flex: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);

<script>
// ================= AUTO CACHE BUSTER (V7 FOODPANDA FLAWLESS UI) =================
const CURRENT_VERSION = 'v14-exe-parity-complete'
if (localStorage.getItem('app_installed_version') !== CURRENT_VERSION) {
  localStorage.setItem('app_installed_version', CURRENT_VERSION)
  if ('caches' in window) {
    caches.keys().then((names) => {
      for (const name of names) caches.delete(name)
    })
  }
}

const $ = (id) => document.getElementById(id)
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const rs = (n) => 'Rs ' + Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 })
const pad = (n) => String(n ?? 0).padStart(4, '0')
const p2 = (n) => String(n).padStart(2, '0')
const fmt = (d) => d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate())
const parse = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d) }
const today = () => fmt(new Date())
const main = $('main')

// Register Service Worker for offline PWA capability
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch((err) => console.log('SW reg error', err))
  })
}

// Persistent token (localStorage + sessionStorage)
let token = localStorage.getItem('tok') || sessionStorage.getItem('tok') || ''
const impName = sessionStorage.getItem('imp') || ''
if (!token && !localStorage.getItem('cached_api_/api/me')) location.replace('/')

function updateNetStatus() {
  const isOff = !navigator.onLine
  const b = $('mobNetBadge')
  if (b) {
    b.className = isOff ? 'net-badge offline' : 'net-badge'
    b.textContent = isOff ? '🟠 Offline' : '🟢 Online'
  }
}
window.addEventListener('online', () => {
  updateNetStatus()
  syncOfflineQueue()
  loadCatalog()
})
window.addEventListener('offline', updateNetStatus)

async function api(url, body, method) {
  const m = method || (body !== undefined ? 'POST' : 'GET')
  const opt = { method: m, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token } }
  if (body !== undefined && m !== 'GET') opt.body = JSON.stringify(body)
  let r
  try {
    r = await fetch(url, opt)
  } catch (err) {
    if (m === 'GET') {
      const cached = localStorage.getItem('cached_api_' + url)
      if (cached) {
        try { return { ok: true, offline: true, ...JSON.parse(cached) } } catch {}
      }
    }
    return { ok: false, offline: true, message: 'Offline mode: Cannot reach server' }
  }
  if (r.status === 401) {
    sessionStorage.removeItem('tok')
    localStorage.removeItem('tok')
    location.replace('/')
    return { ok: false, message: 'Please log in again' }
  }
  try {
    const data = await r.json()
    if (data.ok && m === 'GET') {
      localStorage.setItem('cached_api_' + url, JSON.stringify(data))
    }
    return data
  } catch {
    return { ok: false, message: 'Server error' }
  }
}

const NAV = ['Billing', 'Dashboard', 'Products', 'Reports', 'Settings']
const NAV_ICONS = { Billing: '🧾', Dashboard: '📊', Products: '🍔', Reports: '📑', Settings: '⚙️' }
let me = null, page = 'Billing'

function licStrip() {
  const l = me && me.license
  if (!l || !l.message) return ''
  if (l.state === 'active' && (l.days_left === 0 || l.message.includes('0 day'))) return ''
  if (window.innerWidth <= 768 && page === 'Billing') return ''
  const red = l.state !== 'active' || (l.days_left !== null && l.days_left < 0)
  return `<div class="lic" style="background:${red ? '#FEE2E2' : '#FEF3C7'};color:${red ? '#991B1B' : '#92400E'};padding:8px 14px;border-radius:10px;font-size:12.5px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px">
    <span>⚡ ${esc(l.message)}</span>
  </div>`
}
const kpi = (a, b) => `<div class="kpi"><span>${a}</span><b>${b}</b></div>`
const hbars = (rows) => {
  const max = Math.max(...rows.map((r) => r.value), 1)
  return rows.map((r) => `<div class="bar"><span class="n">${esc(r.name)}</span><div class="t"><i style="width:${(r.value / max) * 100}%"></i></div><span class="q">${r.value}</span></div>`).join('')
}
const paymentsHtml = (p) => p.length
  ? p.map((x) => `<div class="pay"><span>${esc(x.method)}</span><b>${rs(x.total)}</b></div>`).join('')
  : '<p class="muted">No sales in this period.</p>'

function go(p) {
  page = p
  document.querySelectorAll('.nav').forEach((b) => b.classList.toggle('on', b.dataset.p === p))
  document.querySelectorAll('.mob-nav-btn').forEach((b) => b.classList.toggle('on', b.dataset.p === p))
  main.scrollTop = 0
  const mobBar = $('mobCartBar')
  if (mobBar && p !== 'Billing') mobBar.style.display = 'none'
  ;({ Billing: viewBilling, Dashboard: viewDashboard, Products: viewProducts, Reports: viewReports, Staff: viewStaff, Settings: viewSettings })[p]()
}

// ---------- Billing (POS) ----------

// ================= BLUETOOTH THERMAL PRINTER DRIVER =================
let btDevice = null
let btCharacteristic = null
let btPrinterName = localStorage.getItem('bt_printer_name') || ''
let btPrinterWidth = localStorage.getItem('bt_printer_width') || '58' // '58' or '80'

function updateBtStatusUi() {
  const btn = $('btHeaderBtn')
  if (!btn) return
  if (btCharacteristic) {
    btn.className = 'mob-bt-btn connected'
    btn.innerHTML = '🖨️ ' + esc(btPrinterName || 'Printer')
  } else if (btPrinterName) {
    btn.className = 'mob-bt-btn'
    btn.innerHTML = '🖨️ Reconnect'
  } else {
    btn.className = 'mob-bt-btn'
    btn.innerHTML = '🖨️ Connect BT'
  }
}

async function connectBluetoothPrinter() {
  if (!navigator.bluetooth) {
    alert('Web Bluetooth is supported in Chrome on Android.\n\nTip: You can also print using normal Print window to any Bluetooth / Wi-Fi printer connected to your phone!')
    return false
  }
  try {
    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [
        '000018f0-0000-1000-8000-00805f9b34fb', // Standard ESC/POS thermal printer service
        'e7810a71-73ae-499d-8c15-faa9aef0c3f2',
        '49535343-fe7d-4ae5-8fa9-9fafd205e455'
      ]
    })
    const server = await device.gatt.connect()
    let foundChar = null
    const services = await server.getPrimaryServices()
    for (const service of services) {
      const chars = await service.getCharacteristics()
      for (const c of chars) {
        if (c.properties.write || c.properties.writeWithoutResponse) {
          foundChar = c
          break
        }
      }
      if (foundChar) break
    }
    if (!foundChar) {
      alert('Could not find write channel on this printer. Please ensure printer is powered on and paired.')
      return false
    }
    btDevice = device
    btCharacteristic = foundChar
    btPrinterName = device.name || 'BT Printer'
    localStorage.setItem('bt_printer_name', btPrinterName)
    updateBtStatusUi()
    alert('✅ Connected successfully to ' + btPrinterName + '!')
    closeModal()
    return true
  } catch (err) {
    console.error('Bluetooth error:', err)
    if (err.name !== 'NotFoundError') {
      alert('Bluetooth connection failed: ' + (err.message || 'Error connecting.'))
    }
    return false
  }
}

function disconnectBluetoothPrinter() {
  if (btDevice && btDevice.gatt.connected) {
    btDevice.gatt.disconnect()
  }
  btDevice = null
  btCharacteristic = null
  btPrinterName = ''
  localStorage.removeItem('bt_printer_name')
  updateBtStatusUi()
  alert('Printer disconnected.')
  closeModal()
}

// Convert receipt into ESC/POS bytes
function generateEscPosBytes(bill, s) {
  const enc = new TextEncoder()
  const bytes = []
  const push = (arr) => { for (const b of arr) bytes.push(b) }
  const pushText = (str) => {
    const b = enc.encode(str)
    for (const x of b) bytes.push(x)
  }

  const is58 = btPrinterWidth === '58'
  const colWidth = is58 ? 32 : 48

  // Initialize printer
  push([0x1B, 0x40]) // ESC @
  // Center align
  push([0x1B, 0x61, 0x01])

  // Header
  push([0x1B, 0x21, 0x18]) // Double height + bold
  pushText((s.restaurant_name || 'RESTAURANT POS') + '\n')
  push([0x1B, 0x21, 0x00]) // Normal
  if (s.address) pushText(s.address + '\n')
  if (s.phone) pushText('Tel: ' + s.phone + '\n')
  pushText('--------------------------------\n')

  push([0x1B, 0x21, 0x08]) // Bold
  pushText(`Bill #: ${pad(bill.bill_no)}\n`)
  push([0x1B, 0x21, 0x00]) // Normal
  pushText('--------------------------------\n')

  // Left align
  push([0x1B, 0x61, 0x00])
  pushText(`Date: ${bill.created_at || new Date().toLocaleString()}\n`)
  pushText(`Type: ${bill.order_type || 'Takeaway'}\n`)
  if (bill.table_name) pushText(`Table: ${bill.table_name}\n`)
  if (bill.waiter_name) pushText(`Waiter: ${bill.waiter_name}\n`)
  pushText('--------------------------------\n')

  // Items table
  push([0x1B, 0x21, 0x08]) // Bold
  pushText(is58 ? 'Item            Qty       Amount\n' : 'Item                         Qty          Amount\n')
  push([0x1B, 0x21, 0x00]) // Normal
  pushText('--------------------------------\n')

  for (const item of (bill.items || [])) {
    const nameLine = item.name.slice(0, is58 ? 16 : 26).padEnd(is58 ? 16 : 26)
    const qtyLine = String(item.qty).padStart(3)
    const amtLine = String(item.qty * item.price).padStart(is58 ? 11 : 17)
    pushText(nameLine + qtyLine + amtLine + '\n')
    if (item.note) {
      const cleanNote = item.note.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F1E0}-\u{1F1FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{FE00}-\u{FE0F}\u{1F900}-\u{1F9FF}\u{1FA70}-\u{1FAFF}]/gu, '').trim()
      if (cleanNote) {
        cleanNote.split('\n').map((l) => l.trim()).filter(Boolean).forEach((line) => {
          const raw = line.replace(/^[•\-\*\s]+/, '').trim()
          pushText('  * ' + raw + '\n')
        })
      }
    }
  }
  pushText('--------------------------------\n')

  // Totals
  const padRow = (label, val) => {
    const l = label.slice(0, 15)
    const v = String(val)
    return l + ' '.repeat(Math.max(1, colWidth - l.length - v.length)) + v + '\n'
  }
  pushText(padRow('Subtotal:', rs(bill.subtotal)))
  if (bill.discount > 0) pushText(padRow('Discount:', '-' + rs(bill.discount)))
  if (bill.tax > 0) pushText(padRow('Tax:', rs(bill.tax)))

  push([0x1B, 0x21, 0x18]) // Double size
  pushText(padRow('TOTAL:', rs(bill.total)))
  push([0x1B, 0x21, 0x00]) // Normal
  pushText('--------------------------------\n')

  // Footer (Center align)
  push([0x1B, 0x61, 0x01])
  pushText((s.footer || 'Thank you! Visit again.') + '\n')
  pushText('\n\n\n') // feed paper
  push([0x1D, 0x56, 0x41, 0x10]) // Cut paper if supported

  return new Uint8Array(bytes)
}

function generateEscPosKotBytes(kot, s) {
  const enc = new TextEncoder()
  const bytes = []
  const push = (arr) => { for (const b of arr) bytes.push(b) }
  const pushText = (str) => {
    const b = enc.encode(str)
    for (const x of b) bytes.push(x)
  }

  const is58 = btPrinterWidth === '58'

  push([0x1B, 0x40]) // init
  push([0x1B, 0x61, 0x01]) // center
  push([0x1B, 0x21, 0x18]) // double size
  pushText('KITCHEN ORDER (KOT)\n')
  push([0x1B, 0x21, 0x00])
  pushText('--------------------------------\n')

  push([0x1B, 0x61, 0x00]) // left
  push([0x1B, 0x21, 0x08]) // bold
  if (kot.table_name) pushText(`TABLE: ${kot.table_name}\n`)
  if (kot.waiter_name) pushText(`WAITER: ${kot.waiter_name}\n`)
  push([0x1B, 0x21, 0x00])
  pushText(`TIME: ${new Date().toLocaleTimeString()}\n`)
  pushText('--------------------------------\n')

  push([0x1B, 0x21, 0x08])
  pushText(is58 ? 'Item                         Qty\n' : 'Item                                         Qty\n')
  push([0x1B, 0x21, 0x00])
  pushText('--------------------------------\n')

  for (const item of (kot.items || [])) {
    const nameLine = item.name.slice(0, is58 ? 26 : 40).padEnd(is58 ? 26 : 40)
    const qtyLine = ('x ' + item.qty).padStart(is58 ? 6 : 8)
    push([0x1B, 0x21, 0x08])
    pushText(nameLine + qtyLine + '\n')
    push([0x1B, 0x21, 0x00])
    if (item.note) {
      const cleanNote = item.note.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F1E0}-\u{1F1FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{FE00}-\u{FE0F}\u{1F900}-\u{1F9FF}\u{1FA70}-\u{1FAFF}]/gu, '').trim()
      if (cleanNote) {
        cleanNote.split('\n').map((l) => l.trim()).filter(Boolean).forEach((line) => {
          const raw = line.replace(/^[•\-\*\s]+/, '').trim()
          pushText('  * ' + raw + '\n')
        })
      }
    }
  }

  pushText('--------------------------------\n\n\n')
  push([0x1D, 0x56, 0x41, 0x10])
  return new Uint8Array(bytes)
}

async function sendBytesToBluetooth(byteArray) {
  if (!btCharacteristic) return false
  const CHUNK_SIZE = 512
  for (let i = 0; i < byteArray.length; i += CHUNK_SIZE) {
    const chunk = byteArray.slice(i, i + CHUNK_SIZE)
    if (btCharacteristic.writeValueWithoutResponse) {
      await btCharacteristic.writeValueWithoutResponse(chunk)
    } else {
      await btCharacteristic.writeValue(chunk)
    }
    await new Promise((r) => setTimeout(r, 25))
  }
  return true
}

function getFoodIcon(name) {
  const n = String(name || '').toLowerCase()
  if (n.includes('burg') || n.includes('patty')) return '🍔'
  if (n.includes('drink') || n.includes('cola') || n.includes('7up') || n.includes('sprite') || n.includes('soda') || n.includes('water') || n.includes('pepsi') || n.includes('sting')) return '🥤'
  if (n.includes('shawarma') || n.includes('roll') || n.includes('wrap')) return '🌯'
  if (n.includes('pizza')) return '🍕'
  if (n.includes('roti') || n.includes('naan') || n.includes('paratha')) return '🫓'
  if (n.includes('chai') || n.includes('tea') || n.includes('coffee') || n.includes('caffe')) return '☕'
  if (n.includes('chany') || n.includes('karahi') || n.includes('desi') || n.includes('handi') || n.includes('salan') || n.includes('biryani') || n.includes('rice')) return '🍛'
  if (n.includes('sweet') || n.includes('ice') || n.includes('kheer')) return '🍨'
  return '🍽️'
}

function drawBilling() {
  if (page !== 'Billing') return
  const categories = catalog.categories || []
  const prods = (catalog.products || []).filter((p) => {
    if (billCat !== 'all' && p.category_id !== billCat) return false
    if (billSearch) {
      const q = billSearch.toLowerCase()
      const nMatch = p.name.toLowerCase().includes(q)
      const vMatch = (p.variants || []).some((v) => v.name && v.name.toLowerCase().includes(q))
      if (!nMatch && !vMatch) return false
    }
    return true
  })

  const subtotal = billCart.reduce((s, i) => s + (i.qty * i.price), 0)
  const taxPct = Number(settingsCache.tax_percent || 0)
  const taxable = Math.max(0, subtotal - billDiscount)
  const tax = taxPct > 0 ? (taxable * (taxPct / 100)) : 0
  const total = Math.max(0, taxable + tax)
  const totalQty = billCart.reduce((s, i) => s + i.qty, 0)
  updateMobCartBar(totalQty, total)

  const tables = (tablesList && tablesList.length) ? tablesList : [
    { id: '1', name: 'Table 1' }, { id: '2', name: 'Table 2' }, { id: '3', name: 'Table 3' },

  const occCount = tables.filter(t => occupiedTables.includes(t.name)).length
  const availCount = tables.length - occCount
  const isCurrentTableActive = billOrderType === 'Dine-in' && billTable && activeOrders.some(ao => ao.table_name === billTable)
  const activeTableOrder = isCurrentTableActive ? activeOrders.find(ao => ao.table_name === billTable) : null

    if (vars.length === 1) priceText = rs(vars[0].price)

    const isOut = p.track_stock && totalStock <= 0
    const inCartItems = billCart.filter((x) => x.product_id === p.id || x.id === p.id)

// ---------- Dashboard ----------
let dashCache = null

function getLowStockVariants() {
  const list = []
  for (const p of (catalog.products || [])) {
    if (!p.track_stock) continue
    const cat = (catalog.categories || []).find((c) => c.id === p.category_id)
    for (const v of (p.variants || [])) {
      const st = Number(v.stock ?? 0)
      const mst = Number(v.min_stock ?? 5)
      if (st <= mst) {
        list.push({
          product_id: p.id,
          variant_id: v.id,
          product_name: p.name,
          variant_name: v.name,
          display_name: v.name ? `${p.name} (${v.name})` : p.name,
          image: p.image,
          category_name: cat ? cat.name : '',
          stock: st,
          min_stock: mst,
          isOut: st <= 0
        })
      }
    }
  }
  return list
}

function renderDashboard(d) {
  const s = d.summary
  const lowList = getLowStockVariants()
  const lowStockHtml = lowList.length ? `
    <div style="background:#FFFBEB;border:1px solid #FCD34D;border-radius:12px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:22px">⚠️</span>
        <div>
          <b style="color:#92400E;font-size:15px">${lowList.length} Item(s) Low on Stock!</b>
          <div style="font-size:13px;color:#78350F;margin-top:2px">${lowList.map((v) => `${esc(v.display_name)} (${v.stock} left)`).slice(0, 3).join(', ')}${lowList.length > 3 ? '...' : ''}</div>
        </div>
      </div>
      <button class="btn" style="background:#FEF3C7;border-color:#F59E0B;color:#92400E;font-weight:700" data-a="golowstock">Manage Stock →</button>
    </div>` : ''

  main.innerHTML = `<div class="pad">${licStrip()}${lowStockHtml}<h2>Today at a glance</h2>
    <div class="row">${kpi("Today's sales", rs(s.sales))}${kpi('Customers', s.guests)}${kpi('Items sold', s.items_sold)}</div>
    <div class="row top">
      <div class="card grow2"><b>All items sold today (quantity)</b>
        ${d.items.length ? hbars(d.items.map((i) => ({ name: i.name, value: i.qty }))) : '<p class="muted">No sales yet today.</p>'}</div>
      <div class="card grow1"><b>Payments received</b>${paymentsHtml(d.payments)}</div>
    </div></div>`
}

async function viewDashboard() {
  if (dashCache) renderDashboard(dashCache)
  else main.innerHTML = '<div class="pad muted">Loading...</div>'
  const t = today()
  const [d] = await Promise.all([
    api(`/api/report?from=${t}&to=${t}`),
    loadCatalog()
  ])
  if (!d.ok) {
    if (!dashCache) main.innerHTML = `<div class="pad err">${esc(d.message)}</div>`
    return
  }
  dashCache = d
  if (page === 'Dashboard') renderDashboard(d)
}

function productListHtml() {
  const list = catalog.products.filter((p) => p.category_id === prodCat && p.name.toLowerCase().includes(prodSearch.toLowerCase()))
  if (!list.length) return '<p class="muted" style="margin-top:20px">No products here yet. Click Add product.</p>'
  return list.map((p) => {
    let stockChip = ''
    if (p.track_stock) {
      const st = Number(p.stock)
      const mst = Number(p.min_stock ?? 5)
      if (st <= 0) {
        stockChip = '<span class="chip" style="background:#FEE2E2;color:#991B1B;font-weight:700">🔴 Out of stock (0)</span>'
      } else if (st <= mst) {

    const existing = draft.variants[i] || {}
    return {
      id: existing.id || '',
      name: r.querySelector('.vn').value,
      price: r.querySelector('.vp').value,
      stock: r.querySelector('.vs') ? Math.max(0, parseInt(r.querySelector('.vs').value, 10) || 0) : (existing.stock ?? 0),
      min_stock: r.querySelector('.vms') ? Math.max(0, parseInt(r.querySelector('.vms').value, 10) || 0) : (existing.min_stock ?? 5)
    }
  })
  draft.stock = draft.track_stock ? draft.variants.reduce((sum, v) => sum + (v.stock || 0), 0) : 0
  draft.min_stock = draft.variants.length ? Math.min(...draft.variants.map((v) => v.min_stock)) : 5
}

function resizeImage(file) {
  return new Promise((resolve) => {
    const img = new Image()
    img.onload = () => {
      const max = 400
      let w = img.width, h = img.height
      if (w > max || h > max) {
        if (w > h) { h = Math.round((h * max) / w); w = max }
        else { w = Math.round((w * max) / h); h = max }
      }
      const cv = document.createElement('canvas')
      cv.width = w; cv.height = h
      cv.getContext('2d').drawImage(img, 0, 0, w, h)
      resolve(cv.toDataURL('image/jpeg', 0.8))
    }
    const rd = new FileReader()
    rd.onload = (e) => (img.src = e.target.result)
    rd.readAsDataURL(file)
  })
}

const rep = { period: 'day', date: today(), month: today().slice(0, 7), year: today().slice(0, 4), from: today(), to: today(), data: null, range: null, limit: 100 }

function repControls() {
  const p = rep.period
  const btn = (k, l) => `<button class="${p === k ? 'on' : ''}" data-a="period" data-p="${k}">${l}</button>`
  let sub = ''
  if (p === 'day') sub = `<input type="date" id="rdate" class="inp" value="${rep.date}">`
  if (p === 'month') sub = `<input type="month" id="rmonth" class="inp" value="${rep.month}">`
  if (p === 'year') {
    const y = Number(today().slice(0, 4))
    const opts = [y, y - 1, y - 2].map((x) => `<option value="${x}" ${String(x) === rep.year ? 'selected' : ''}>${x}</option>`).join('')
    sub = `<select id="ryear" class="inp">${opts}</select>`
  }
  if (p === 'custom') sub = `<input type="date" id="rfrom" class="inp" value="${rep.from}"><span class="muted">to</span><input type="date" id="rto" class="inp" value="${rep.to}">`
  $('repCtl').innerHTML = `<div class="tabs">${btn('day', 'Day')}${btn('month', 'Month')}${btn('year', 'Year')}${btn('custom', 'Custom range')}</div><div class="ctl">${sub}</div>`
}

function repRange() {
  const p = rep.period
  if (p === 'day') return { from: rep.date, to: rep.date }
  if (p === 'month') {
    const [y, m] = rep.month.split('-').map(Number)
    const last = new Date(y, m, 0).getDate()
    return { from: `${rep.month}-01`, to: `${rep.month}-${p2(last)}` }
  }
  if (p === 'year') return { from: `${rep.year}-01-01`, to: `${rep.year}-12-31` }
  return { from: rep.from, to: rep.to }
}

async function loadReport() {
  const r = repRange()
  const ok = /^\d{4}-\d{2}-\d{2}$/.test(r.from) && /^\d{4}-\d{2}-\d{2}$/.test(r.to) && r.from <= r.to && Number(r.from.slice(0, 4)) > 1999
  if (!ok) { $('repOut').innerHTML = '<p class="err">Choose a valid date range (From must not be after To).</p>'; return }
  if (!rep.data) $('repOut').innerHTML = '<p class="muted">Loading...</p>'
  const d = await api(`/api/report?from=${r.from}&to=${r.to}&bills=1`)
  if (!d.ok) { $('repOut').innerHTML = `<p class="err">${esc(d.message)}</p>`; return }
  rep.data = d; rep.range = r; rep.limit = 100
  drawReport()
}

function drawReport() {
  const d = rep.data, r = rep.range, s = d.summary
  const when = (b) => (r.from === r.to ? b.created_at.slice(11, 16) : b.created_at.slice(0, 10) + '  ' + b.created_at.slice(11, 16))
  const shown = d.bills.slice(0, rep.limit)
  $('repOut').innerHTML = `<div class="muted">Showing ${r.from === r.to ? r.from : r.from + ' to ' + r.to}</div>
    <div class="row" style="margin-top:12px">${kpi('Total sales', rs(s.sales))}${kpi('Customers', s.guests)}${kpi('Items sold', s.items_sold)}
      ${d.payments.map((p) => kpi(esc(p.method) + ' payments', rs(p.total))).join('')}</div>
    <div class="card" style="margin-top:16px"><b>All customers</b>
      ${d.bills.length ? shown.map((b) => `<div class="bill">
        <div class="l"><b>Bill ${pad(b.bill_no)}</b><div class="muted">${esc(when(b))}</div><div class="muted">${esc(b.order_type || '')}${b.table_name ? ' - Table ' + esc(b.table_name) : ''}</div></div>
        <div class="m">${(b.items || []).map((i) => `<div class="li"><span>${esc(i.name)} x ${i.qty}</span><span class="muted">${rs(i.qty * i.price)}</span></div>`).join('')}
          ${b.discount > 0 || b.tax > 0 ? `<div class="muted" style="font-size:12px;margin-top:4px">${b.discount > 0 ? 'Discount ' + rs(b.discount) : ''}${b.discount > 0 && b.tax > 0 ? '  |  ' : ''}${b.tax > 0 ? 'Tax ' + rs(b.tax) : ''}</div>` : ''}</div>
        <div class="r"><b style="font-size:17px">${rs(b.total)}</b><div class="muted">${esc(b.payment_method)}</div></div></div>`).join('')
        : '<p class="muted">No sales in this period.</p>'}
      ${d.bills.length > rep.limit ? `<div style="text-align:center;padding-top:14px"><button class="btn" data-a="more">Show more (${d.bills.length - rep.limit} remaining)</button></div>` : ''}</div>`
}

function exportCsv() {
  if (!rep.data) return
  const d = rep.data, r = rep.range, q = (s) => `"${String(s ?? '').replace(/"/g, '""')}"`
  const lines = [`Report,${r.from} to ${r.to}`, `Total sales,${d.summary.sales}`, `Customers,${d.summary.guests}`,
    ...d.payments.map((p) => `${p.method} payments,${p.total}`), '', 'Bill ID,Date,Time,Type,Table,Items,Payment,Amount',
    ...d.bills.map((b) => [pad(b.bill_no), b.created_at.slice(0, 10), b.created_at.slice(11, 16), q(b.order_type), q(b.table_name),
      q((b.items || []).map((i) => `${i.name} x ${i.qty}`).join('; ')), q(b.payment_method), b.total].join(','))]
  const a = document.createElement('a')
  a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/csv' }))
  a.download = `report-${r.from}-to-${r.to}.csv`
  a.click()
}

      billGuests = active.guests || 1
      billDiscount = Number(active.discount || 0)

    }

    if (window.innerWidth <= 768) renderMobile()
  },
  possavetableorder: () => {
    if (!billCart.length) {
      alert('Please add items to order first')
      return
    }
    if (!billTable) billTable = 'Table 1'
    billOrderType = 'Dine-in'
    const existingIdx = activeOrders.findIndex(ao => ao.table_name === billTable)
    const orderData = {
      table_name: billTable,
      cart: JSON.parse(JSON.stringify(billCart)),
      waiter: billWaiter || '',
      guests: Number(billGuests || 1),
      discount: Number(billDiscount || 0),
      order_no: curOrderNo || Math.floor(100 + Math.random() * 900),
      total: billCart.reduce((s, i) => s + (i.qty * i.price), 0) - (billDiscount || 0),
      updated_at: new Date().toLocaleTimeString()
    }
    if (existingIdx >= 0) {
      activeOrders[existingIdx] = orderData
    } else {
      activeOrders.push(orderData)
    }
    saveActiveOrdersStore()
    billToast = `Saved running order on ${billTable} (Order #${pad(orderData.order_no)}). Table is now held.`
    drawBilling()

      const activeIdx = activeOrders.findIndex(ao => ao.table_name === billTable)
      if (activeIdx >= 0) {
        activeOrders[activeIdx].table_name = target.trim()

    const isNoPrint = (d && d.noPrint) === true;
    if (!billCart.length) return
    const subtotal = billCart.reduce((s, i) => s + (i.qty * i.price), 0)
    const taxPct = Number(settingsCache.tax_percent || 0)
    const taxable = Math.max(0, subtotal - billDiscount)
    const tax = taxPct > 0 ? (taxable * (taxPct / 100)) : 0
    const total = Math.max(0, taxable + tax)

    const payload = {
      order_type: billOrderType,
      table_name: billOrderType === 'Dine-in' ? billTable : '',
      waiter_name: billWaiter,
      guests: Number(billGuests) || 1,
      subtotal,
      discount: billDiscount,
      tax,
      total,
      payment_method: billPayment,
      items: billCart
    }

    let billSaved = null
    const r = await api('/api/orders', payload)
    if (r.ok && r.bill) {
      billSaved = r.bill
      billToast = `✅ Bill #${pad(r.bill.bill_no)} saved & printed successfully!`
    } else {
      // Offline fallback: generate local offline bill and queue for sync
      const offNo = (Math.floor(Math.random() * 8999) + 1000)
      billSaved = {
        bill_no: offNo,
        created_at: new Date().toLocaleString(),
        ...payload
      }
      const q = JSON.parse(localStorage.getItem('offline_bills_queue') || '[]')
      q.push(payload)
      localStorage.setItem('offline_bills_queue', JSON.stringify(q))
      billToast = `🟠 Bill #${offNo} saved offline & printed! Will sync when internet reconnects.`
    }

    // If Bluetooth printer is connected, print via ESC/POS directly!
    let printedViaBt = false
    if (btCharacteristic) {
      try {
        const bytes = generateEscPosBytes(billSaved, settingsCache)
        await sendBytesToBluetooth(bytes)
        printedViaBt = true
      } catch (btErr) {
        console.warn('Bluetooth print failed, falling back to window print:', btErr)
      }
    }
    if (!printedViaBt) {
      const html = buildOnlineReceiptHtml(billSaved, settingsCache)
      printThermalHtml(html)
    }

    if (billOrderType === 'Dine-in' && billTable) {
      activeOrders = activeOrders.filter(ao => ao.table_name !== billTable)
      saveActiveOrdersStore()
    }
    delete billHeldTables[billTable]
    billCart = []
    curOrderNo = Math.floor(100 + Math.random() * 900)
    billDiscount = 0
    const panel = $('posCartPanel')
    if (panel) panel.classList.remove('mob-open')
    drawBilling()
    if (navigator.onLine) loadCatalog()
  },

async function syncOfflineQueue() {
  const qStr = localStorage.getItem('offline_bills_queue')
  if (!qStr) return
  const q = JSON.parse(qStr || '[]')
  if (!q.length) return
  let remaining = []
  for (const bill of q) {
    try {
      const res = await fetch('/api/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
        body: JSON.stringify(bill)
      })
      const d = await res.json()
      if (!d.ok) remaining.push(bill)
    } catch {
      remaining.push(bill)
    }
  }
  localStorage.setItem('offline_bills_queue', JSON.stringify(remaining))
  if (remaining.length === 0) {
    billToast = '✅ All offline bills synced to cloud successfully!'
    if (page === 'Billing') drawBilling()
  }
}

function showMobToast(msg) {

function mobPickProd(id) {
  const p = (catalog.products || []).find(x => x.id === id || String(x.id) === String(id))
  if (!p) return
  const totalStock = (p.variants || []).reduce((s, v) => s + Number(v.stock || 0), 0)
  if (p.track_stock && totalStock <= 0) {
    return showMobToast(p.name + ' is out of stock')
  }
  if (p.variants && p.variants.length > 1) {
    mobSheet = { t: 'pick', id: p.id, prod: p }
    renderMobile()
  } else {
    mobAddProd(p, 0)
  }
}

function mobAddProd(prod, vi) {
  const v = (prod.variants && prod.variants[vi]) || { name: 'Regular', price: 0 }
  const uid = prod.id + '-' + (v.name || 'default')
  const existing = billCart.find(x => x.uid === uid)
  if (existing) {
    existing.qty++
  } else {
    billCart.push({
      uid: uid,
      product_id: prod.id,
      id: prod.id,
      name: prod.name + (prod.variants && prod.variants.length > 1 ? ' (' + v.name + ')' : ''),
      price: Number(v.price || 0),
      qty: 1,
      variant: v.name,
      note: ''
    })
  }
  mobSheet = null
  showMobToast(prod.name + ' added')
  renderMobile()
  if (page === 'Billing') drawBilling()
}

function mobChangeQty(uid, delta) {
  const item = billCart.find(x => x.uid === uid)
  if (!item) return
  item.qty += delta
  if (item.qty <= 0) {
    billCart = billCart.filter(x => x.uid !== uid)
  }
  if (!billCart.length && mobSheet && mobSheet.t === 'cart') {
    mobSheet = null
  }
  renderMobile()
  if (page === 'Billing') drawBilling()
}

function mobPickTable(t) {
  billTable = t
  billOrderType = 'Dine-in'
  if (billHeldTables[t]) {
    const h = billHeldTables[t]
    billCart = JSON.parse(JSON.stringify(h.cart || []))
    billWaiter = h.waiter || ''
    billGuests = h.guests || 1
    billDiscount = h.discount || 0
    billPayment = h.payment || 'Cash'
    showMobToast('Restored order for ' + t)
  }
  renderMobile()
  if (page === 'Billing') drawBilling()
}

function mobHoldTableOrder() {
  if (billOrderType !== 'Dine-in' || !billTable) return showMobToast('Select a table first')
  if (!billCart.length) return showMobToast('Cart is empty')
  billHeldTables[billTable] = {
    cart: JSON.parse(JSON.stringify(billCart)),
    waiter: billWaiter || '',
    guests: billGuests || 1,
    discount: billDiscount || 0,
    payment: billPayment || 'Cash',
    orderType: 'Dine-in',
    heldAt: new Date().toLocaleTimeString()
  }
  saveHeldTables()
  billCart = []
  billDiscount = 0
  mobSheet = null
  showMobToast('Order held on ' + billTable)
  renderMobile()
  if (page === 'Billing') drawBilling()
}

async function mobFinishOrder(print) {
  if (!billCart.length) return showMobToast('Cart is empty')
  const totalQty = billCart.reduce((s, i) => s + i.qty, 0)
  const subtotal = billCart.reduce((s, i) => s + (i.qty * i.price), 0)
  const taxPct = Number(settingsCache.tax_percent || 0)
  const taxable = Math.max(0, subtotal - billDiscount)
  const tax = taxPct > 0 ? (taxable * (taxPct / 100)) : 0
  const total = Math.max(0, taxable + tax)

  const bill = {
    bill_no: Date.now().toString().slice(-4),
    order_type: billOrderType,
    table_name: billOrderType === 'Dine-in' ? billTable : null,
    waiter_name: billWaiter || null,
    guests: billGuests || 1,
    subtotal: subtotal,
    discount: billDiscount || 0,
    tax: tax,
    total: total,
    payment_method: billPayment || 'Cash',
    created_at: new Date().toLocaleString(),
    items: billCart.map(i => ({
      product_id: i.product_id || i.id,
      name: i.name,
      qty: i.qty,
      price: i.price,
      variant: i.variant || null,
      note: i.note || ''
    }))
  }

  // 1. Bluetooth 58mm/80mm ESC/POS Printing
  if (print && btCharacteristic) {
    try {
      const bytes = generateEscPosBytes(bill, settingsCache)
      await sendEscPosToPrinter(bytes)
      showMobToast('Bill printed via Bluetooth')
    } catch (err) {
      console.warn('BT Print failed:', err)
      showMobToast('Printer error: ' + err.message)
    }
  }

  // 2. Save order to backend or queue offline
  try {
    const res = await api('/api/orders', bill, 'POST')
    if (res.ok) {
      playBeep()
      showMobToast('Bill saved successfully')
    } else {
      queueOfflineBill(bill)
      showMobToast('Saved in offline queue')
    }
  } catch (err) {
    queueOfflineBill(bill)
    showMobToast('Saved offline (No internet)')
  }

  // 3. Clear table hold
  if (billTable && billHeldTables[billTable]) {
    delete billHeldTables[billTable]
    saveHeldTables()
  }

  // 4. Reset cart
  billCart = []
  billDiscount = 0
  mobSheet = null
  renderMobile()
  if (page === 'Billing') drawBilling()
}

function mobPrintKot() {
  if (!billCart.length) return showMobToast('Cart is empty')
  if (btCharacteristic) {
    try {
      const kotData = {
        table_name: billOrderType === 'Dine-in' ? billTable : billOrderType,
        waiter_name: billWaiter,
        items: billCart
      }
      const bytes = generateEscPosKotBytes(kotData, settingsCache)
      sendEscPosToPrinter(bytes)
      showMobToast('KOT sent to Bluetooth printer')
    } catch (err) {
      showMobToast('KOT print error')
    }
  } else {
    showMobToast('Printer not connected')
  }
}

async function loadMobileReports() {
  const t = today()
  let from = t, to = t
  if (mobReportsPeriod === 'Yesterday') {
    from = addDays(t, -1)
    to = from
  } else if (mobReportsPeriod === '7 Days') {
    from = addDays(t, -6)
    to = t
  } else if (mobReportsPeriod === '30 Days') {
    from = addDays(t, -29)
    to = t
  } else if (mobReportsPeriod === 'This Month') {
    from = t.slice(0, 8) + '01'
    to = t
  }
  try {

    if (d.ok) {

      renderMobile()
    }
  } catch (err) {

      <div class="stat"><span class="mu">Today’s sales</span><b>${rs(s.sales || 0)}</b></div>
      <div class="stat"><span class="mu">Customers</span><b>${s.guests || 0}</b></div>
      <div class="stat"><span class="mu">Items in menu</span><b>${(catalog.products || []).length}</b></div>
      <div class="stat"><span class="mu">Dishes sold</span><b>${s.items_sold || 0}</b></div>
    </div>

    <h3>Top selling items today</h3>
    <div class="card">
      ${items.length === 0 ? '<div class="mu" style="text-align:center;padding:12px">No sales recorded today yet</div>' : items.slice(0, 5).map((item, idx) => {
        const maxVal = Math.max(1, ...items.map(x => x.qty))
        const pct = Math.round((item.qty / maxVal) * 100)
        return `
          <div style="margin-bottom:10px">
            <div class="row sp"><span style="font-weight:600">${esc(item.name)}</span><b>${item.qty} sold</b></div>
            <div class="bar"><i style="width:${pct}%"></i></div>
          </div>
        `
      }).join('')}
    </div>

    <h3>Payments received</h3>
    ${payments.length === 0 ? `
      <div class="card row sp">
        <span>Cash</span><b>${rs(s.sales || 0)}</b>
      </div>
    ` : payments.map(p => `
      <div class="card row sp" style="margin-bottom:6px">
        <span>${esc(p.method || 'Cash')}</span><b>${rs(p.total || 0)}</b>
      </div>
    `).join('')}
  `
}

let mobProdCat = null
let mobProdSearch = ''

function openProductModal(id) {
  if (id) {
    const p = (catalog.products || []).find(x => x.id === id || String(x.id) === String(id))
    if (p) openProduct(p)
  } else {

function renderMobileProducts() {
  const categories = catalog.categories || []
  const allProds = catalog.products || []
  const lowList = getLowStockVariants()

  // LEVEL 1: If no category selected, show Categories Grid matching Desktop EXE
  if (!mobProdCat) {
    return `
      <div class="row sp" style="margin-bottom:12px">
        <h2 style="margin:0">Categories (${categories.length})</h2>
        ${lowList.length ? `<span class="tag lo" style="font-size:12px;padding:4px 10px">${lowList.length} Low Stock</span>` : ''}
      </div>

      <div class="card" style="margin-bottom:14px;padding:12px">
        <div style="font-size:12px;font-weight:700;color:var(--mu);margin-bottom:6px;text-transform:uppercase">Add New Category</div>
        <div class="row">
          <input id="mobNewCatInp" placeholder="Category name (e.g. Burgers, Drinks, Salan)" style="flex:1">
          <button class="btn s" data-a="mobaddcategory" style="padding:10px 18px">Add</button>
        </div>
      </div>

      ${categories.length === 0 ? `
        <div class="card" style="text-align:center;padding:36px 16px">
          <div style="font-size:36px;margin-bottom:8px">📂</div>
          <b style="font-size:16px">No categories yet</b>
          <p class="mu" style="margin-top:4px">Add your first category above to organize your menu items.</p>
        </div>
      ` : `
        <div class="grid">
          ${categories.map(c => {
            const list = allProds.filter(p => p.category_id === c.id)
            const th = list.filter(p => p.image).slice(0, 3)
            return `
              <div class="card" data-a="mobopencat" data-id="${esc(c.id)}" style="cursor:pointer;margin:0;padding:14px;display:flex;flex-direction:column;justify-content:space-between">
                <div>
                  <b style="font-size:16px;color:var(--tx);display:block">${esc(c.name)}</b>
                  <span class="mu" style="font-size:12px;margin-top:2px;display:block">${list.length} ${list.length === 1 ? 'product' : 'products'}</span>
                </div>
                <div class="row" style="margin-top:12px;gap:6px">
                  ${th.length ? th.map(t => `<img src="${esc(t.image)}" style="width:36px;height:36px;border-radius:8px;object-fit:cover">`).join('') : '<div style="font-size:24px">🍽️</div>'}
                </div>
              </div>
            `
          }).join('')}
        </div>
      `}
    `
  }

  // LEVEL 2: Category Selected -> Show its Products list matching Desktop EXE
  const curCat = categories.find(c => c.id === mobProdCat) || { id: mobProdCat, name: 'Category' }
  const catProds = allProds.filter(p => {
    if (p.category_id !== mobProdCat) return false
    if (mobProdSearch) {
      const q = mobProdSearch.toLowerCase()
      const nMatch = p.name && p.name.toLowerCase().includes(q)
      const vMatch = (p.variants || []).some(v => v.name && v.name.toLowerCase().includes(q))
      if (!nMatch && !vMatch) return false
    }
    return true
  })

  return `
    <div style="margin-bottom:12px">
      <button class="btn s o" data-a="mobbackcat" style="display:inline-flex;align-items:center;gap:6px;padding:6px 12px;font-size:12px">
        ‹ Back to Categories
      </button>
    </div>

    <div class="card row sp" style="margin-bottom:12px;padding:12px">
      <div>
        <h2 style="margin:0;font-size:18px">${esc(curCat.name)}</h2>
        <span class="mu">${catProds.length} ${catProds.length === 1 ? 'item' : 'items'}</span>
      </div>
      <div style="display:flex;gap:6px">
        <button class="btn s o" data-a="mobrencat" data-id="${esc(curCat.id)}" data-name="${esc(curCat.name)}" style="padding:6px 10px;font-size:12px">Rename</button>
        <button class="btn s d" data-a="mobdelcat" data-id="${esc(curCat.id)}" data-name="${esc(curCat.name)}" style="padding:6px 10px;font-size:12px">Delete</button>
      </div>
    </div>

    <div class="row sp" style="margin-bottom:12px;gap:8px">
      <div style="position:relative;flex:1">
        <input type="text" id="mobProdSearchInp" value="${esc(mobProdSearch)}" placeholder="Search in ${esc(curCat.name)}..." 
          oninput="mobProdSearch=this.value;renderMobile(true)" style="padding-left:36px;border-radius:12px">
        <span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--mu);pointer-events:none">🔍</span>
        ${mobProdSearch ? `<button onclick="mobProdSearch='';renderMobile()" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--mu);cursor:pointer;font-size:16px">✕</button>` : ''}
      </div>
      <button class="btn s" data-a="mobaddprod" style="padding:10px 14px;border-radius:12px;white-space:nowrap">+ Add Product</button>
    </div>

    ${catProds.length === 0 ? `
      <div class="card" style="text-align:center;padding:32px 14px">
        <div style="font-size:32px;margin-bottom:8px">🍽️</div>
        <b style="font-size:15px">No products in this category</b>
        <p class="mu" style="margin:4px 0 14px">Add your dishes, drinks, or items for ${esc(curCat.name)}.</p>
        <button class="btn s" data-a="mobaddprod">+ Add First Product</button>
      </div>
    ` : catProds.map(p => {
      const vars = p.variants || []
      const totalStock = vars.reduce((s, v) => s + Number(v.stock || 0), 0)
      const stockBadge = p.track_stock
        ? (totalStock <= 0
            ? '<span class="tag lo">Out of stock (0)</span>'
            : totalStock <= (p.min_stock ?? 5)
              ? `<span class="tag" style="background:#FEF3C7;color:#92400E">Low stock (${totalStock})</span>`
              : `<span class="tag">${totalStock} in stock</span>`)
        : '<span class="tag">Active</span>'

      return `
        <div class="card" style="margin-bottom:10px;padding:12px">
          <div style="display:flex;gap:12px;align-items:flex-start">
            <div class="th" style="width:64px;height:64px;border-radius:12px;flex:none;background:var(--ln);overflow:hidden">
              ${p.image ? `<img src="${esc(p.image)}" style="width:100%;height:100%;object-fit:cover">` : '<span style="font-size:28px">🍽️</span>'}
            </div>
            <div style="flex:1;min-width:0">
              <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
                <b style="font-size:15px;color:var(--tx)">${esc(p.name)}</b>
                ${stockBadge}
              </div>
              <div class="mu" style="margin-top:3px;font-size:12.5px">
                ${vars.map(v => `${v.name ? esc(v.name) + ': ' : ''}<b>${rs(v.price)}</b>${p.track_stock ? ` (${v.stock ?? 0})` : ''}`).join(' · ')}
              </div>
            </div>
          </div>
          <div class="row" style="margin-top:10px;gap:8px">
            <button class="btn s o" data-a="mobeditprod" data-id="${esc(p.id)}" style="flex:1;padding:8px">✏️ Edit Product</button>
            <button class="btn s d" data-a="mobdelprod" data-id="${esc(p.id)}" data-name="${esc(p.name)}" style="padding:8px 14px">🗑</button>
          </div>
        </div>
      `
    }).join('')}
  `
}

function renderMobileReports() {
  const bills = (repData && repData.bills) || mobDailyBills || []
  const summary = (repData && repData.summary) || {
    sales: bills.reduce((s, b) => s + Number(b.total || 0), 0),

  const periods = [

  return `

    <!-- KPI Cards -->

        <div style="font-size:11px;color:var(--mu);font-weight:700">TOTAL SALES</div>

        <div style="font-size:11px;color:var(--mu);font-weight:700">CUSTOMERS</div>

      </div>
      <div class="card" style="padding:10px;text-align:center">
        <div style="font-size:11px;color:var(--mu);font-weight:700">ITEMS SOLD</div>

    <!-- Bills List Header -->

    ${bills.length === 0 ? `
      <div class="card" style="text-align:center;padding:32px 14px">
        <div style="font-size:32px;margin-bottom:8px">📊</div>
        <b style="font-size:14px;color:var(--tx)">No sales recorded for this period</b>
        <div class="mu" style="font-size:12px;margin-top:4px">Completed customer bills will appear here automatically.</div>
      </div>
    ` : `
      <div style="display:flex;flex-direction:column;gap:10px">
        ${bills.map(b => {
          const bNo = pad(b.bill_no || b.id)
          const bTime = (b.created_at || '').slice(11, 16) || (b.created_at || '')
          const bTotal = rs(b.total || 0)
          const bItems = b.items || []
          const bType = b.order_type || 'Dine-in'
          const bTable = b.table_name ? ` • ${b.table_name}` : ''
          const bWaiter = b.waiter_name ? ` • Waiter: ${b.waiter_name}` : ''
          return `
            <div class="card" style="padding:12px">
              <div class="row sp">
                <div>
                  <b style="font-size:15px;color:var(--tx)">Bill #${bNo}</b>
                  <div class="mu" style="font-size:12px;margin-top:2px">${esc(bType)}${esc(bTable)}${esc(bWaiter)} ${bTime ? `· ${bTime}` : ''}</div>
                </div>
                <div style="text-align:right">
                  <b style="font-size:16px;color:#9A3412">${bTotal}</b>
                  <div class="mu" style="font-size:11px">${esc(b.payment_method || 'Cash')}</div>
                </div>
              </div>
              ${bItems.length ? `
                <div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--bd);font-size:12px;color:var(--mu)">
                  ${bItems.map(bi => `${bi.name} x${bi.qty}`).join(', ')}
                </div>
              ` : ''}
              <div class="row" style="margin-top:10px;gap:8px">
                <button class="btn s o" data-a="mobreprintbill" data-id="${esc(b.id)}" data-no="${bNo}" style="flex:1;padding:7px;font-size:12px">🖨️ Reprint</button>
                <button class="btn s d" data-a="mobvoidbill" data-id="${esc(b.id)}" data-no="${bNo}" style="padding:7px 12px;font-size:12px">Void</button>
              </div>
            </div>
          `
        }).join('')}
      </div>
    `}
  `
}
