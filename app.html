<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Restaurant POS - Portal</title>
<link rel="icon" href="/favicon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#191612">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"></noscript>
<style>
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #F8F6F0;
    color: #1F1B16;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font-family: inherit; }

  #banner {
    background: #92400E;
    color: #fff;
    padding: 10px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex: none;
    font-size: 14px;
  }
  #banner button {
    min-height: 34px;
    border: 1px solid #fff;
    background: transparent;
    color: #fff;
    border-radius: 8px;
    padding: 0 12px;
    cursor: pointer;
    font-weight: 600;
  }

  /* Desktop layout */
  .shell { flex: 1; min-height: 0; display: flex; }
  .side {
    width: 220px;
    background: #191612;
    padding: 24px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: none;
    box-shadow: 2px 0 8px rgba(0,0,0,0.12);
  }
  .brand { color: #F8F6F0; font-weight: 800; font-size: 18px; padding: 0 10px 4px; }
  .rname { color: #D6D3D1; font-size: 13px; padding: 0 10px 18px; word-break: break-word; }
  .nav {
    text-align: left;
    border: 0;
    border-radius: 10px;
    padding: 12px 14px;
    min-height: 44px;
    font-size: 15px;
    cursor: pointer;
    background: transparent;
    color: #D6D3D1;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: all .15s;
  }
  .nav:hover { background: rgba(255,255,255,0.06); color: #fff; }
  .nav.on { background: #9A3412; color: #fff; font-weight: 700; box-shadow: 0 2px 6px rgba(154,52,18,0.3); }
  .pc-btn {
    background: #9A3412 !important;
    color: #fff !important;
    font-weight: 700 !important;
    margin-top: auto !important;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-radius: 10px;
    cursor: pointer;
    border: 0;
    box-shadow: 0 2px 6px rgba(154,52,18,0.3);
  }
  .out {
    background: transparent;
    border: 1px solid #57534E;
    color: #F8F6F0;
    border-radius: 8px;
    padding: 10px 14px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    margin-top: 10px;
    transition: background .15s;
  }
  .out:hover { background: #292524; }

  /* Mobile Elements (Hidden on Desktop) */
  .mob-header { display: none; }
  .mob-nav { display: none; }

  main { flex: 1; overflow-y: auto; overflow-x: hidden; min-width: 0; }
  .pad { padding: 28px; display: grid; gap: 18px; align-content: start; max-width: 1200px; margin: 0 auto; }
  h2 { margin: 0; font-size: 22px; font-weight: 800; color: #1C1917; }
  h3 { margin: 0; font-size: 18px; font-weight: 700; color: #1C1917; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .top { align-items: flex-start; }
  .grow1 { flex: 1; min-width: 260px; }
  .grow2 { flex: 1.5; min-width: 300px; }
  .card {
    background: #ffffff;
    border: 1px solid #EBE4D8;
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.03);
  }
  .kpi {
    background: #ffffff;
    border: 1px solid #EBE4D8;
    border-radius: 14px;
    padding: 18px;
    flex: 1;
    min-width: 160px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.03);
  }
  .kpi span { color: #78716C; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .kpi b { display: block; font-size: 26px; margin-top: 4px; font-weight: 800; color: #1C1917; }
  .muted { color: #78716C; font-size: 14px; }
  .err { color: #DC2626; font-size: 14px; }
  .ok { color: #166534; font-size: 14px; }
  .btn {
    min-height: 40px;
    border: 1px solid #D6CEBE;
    background: #fff;
    border-radius: 8px;
    padding: 0 14px;
    color: #1F1B16;
    cursor: pointer;
    font-size: 14px;
    display: inline-flex;
    align-items: center;
    font-weight: 500;
  }
  .btn.red { color: #DC2626; border-color: #FECACA; background: #FEF2F2; }
  .pri {
    min-height: 44px;
    border: 0;
    border-radius: 10px;
    padding: 0 20px;
    background: #9A3412;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(154,52,18,0.25);
  }
  .inp {
    min-height: 44px;
    border: 1px solid #D6CEBE;
    border-radius: 10px;
    padding: 0 12px;
    font-size: 15px;
    background: #fff;
    color: #1F1B16;
    outline: none;
  }
  .inp:focus {
    border-color: #9A3412;
    box-shadow: 0 0 0 3px rgba(154, 52, 18, 0.15);
  }
  label.f { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 14px; }
  .bar { display: flex; align-items: center; gap: 12px; margin: 12px 0; }
  .bar .n { width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
  .bar .t { flex: 1; height: 14px; background: #EFE8DA; border-radius: 7px; }
  .bar .t i { display: block; height: 14px; background: #9A3412; border-radius: 7px; }
  .bar .q { width: 44px; text-align: right; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  .catcard {
    text-align: left;
    background: #fff;
    border: 1px solid #EBE4D8;
    border-radius: 14px;
    padding: 20px;
    min-height: 140px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 6px;
    color: #1F1B16;
  }
  .catcard b { font-size: 18px; }
  .thumbs { display: flex; gap: 6px; margin-top: auto; }
  .thumbs img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; }
  .prod { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid #EFE8DA; }
  .prod img, .ph { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; flex: none; }
  .ph { background: #E7DFD0; color: #78716C; font-size: 11px; display: flex; align-items: center; justify-content: center; }
  .chip { background: #F3EBDD; border-radius: 14px; padding: 4px 10px; font-size: 13px; display: inline-block; margin: 6px 6px 0 0; }
  .tabs { display: inline-flex; gap: 4px; background: #fff; border: 1px solid #EBE4D8; border-radius: 12px; padding: 4px; }
  .tabs button { min-height: 40px; padding: 0 16px; border: 0; border-radius: 10px; font-size: 14px; cursor: pointer; font-weight: 600; background: transparent; color: #1F1B16; }
  .tabs button.on { background: #9A3412; color: #fff; }
  .ctl { display: flex; align-items: center; gap: 8px; font-size: 14px; flex-wrap: wrap; }
  .bill { display: flex; gap: 14px; padding: 14px 0; border-top: 1px solid #EFE8DA; flex-wrap: wrap; }
  .bill .l { width: 160px; flex: none; }
  .bill .m { flex: 1; min-width: 200px; }
  .bill .r { width: 130px; text-align: right; flex: none; }
  .li { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; font-size: 14px; }
  .pay { display: flex; justify-content: space-between; padding: 12px 0; border-top: 1px solid #EFE8DA; font-size: 15px; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .mbox { background: #fff; border-radius: 16px; width: 540px; max-width: 100%; max-height: 90vh; overflow-y: auto; padding: 26px; display: grid; gap: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
  .vrow { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  .vrow .vn { flex: 1; min-width: 0; }
  .vrow .vp { width: 95px; }
  .vrow .vs { width: 85px; }
  .vrow .vms { width: 75px; }
  .photo { display: flex; align-items: center; gap: 12px; }
  .photo img, .photo .ph { width: 72px; height: 72px; }
  .mrow { display: flex; gap: 10px; }
  .mrow .pri { flex: 1; }
  .lic { padding: 12px 16px; border-radius: 10px; font-size: 14px; }

    /* Bluetooth & Native Mobile App UI */
  .mob-bt-btn {
    background: #292524 !important;
    border: 1px solid #44403C !important;
    color: #38BDF8 !important;
    border-radius: 8px !important;
    padding: 5px 9px !important;
    font-size: 11.5px !important;
    font-weight: 700 !important;
    cursor: pointer !important;
    display: inline-flex !important;
    align-items: center !important;
    gap: 4px !important;
  }
  .mob-bt-btn.connected {
    background: #064E3B !important;
    border-color: #059669 !important;
    color: #34D399 !important;
  }
  .pos-top-action-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #ffffff;
    border: 1px solid #EBE4D8;
    border-radius: 14px;
    padding: 6px 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.03);
    margin-bottom: 2px;
  }
  .pos-table-badge-btn {
    height: 38px !important;
    min-height: 38px !important;
    padding: 0 12px !important;
    border-radius: 10px !important;
    background: #FAF6F0 !important;
    border: 1.5px solid #D6CEBE !important;
    color: #1F1B16 !important;
    display: inline-flex !important;
    align-items: center !important;
    gap: 6px !important;
    cursor: pointer !important;
    flex: none !important;
    white-space: nowrap !important;
    font-weight: 800 !important;
    font-size: 13.5px !important;
    transition: all .15s !important;
  }
  .pos-table-badge-btn:active {
    background: #EFE8DA !important;
    transform: scale(0.97) !important;
  }
  .pos-top-search {
    width: 100%;
    height: 38px;
    min-height: 38px;
    border: 0;
    background: transparent;
    padding: 0 6px;
    font-size: 14px;
    color: #1F1B16;
    outline: none;
    font-family: inherit;
  }
  .pos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
  }
  @media (max-width: 768px) {
    .pos-grid {
      grid-template-columns: repeat(2, 1fr) !important;
      gap: 10px !important;
    }
  }
  .pos-card {
    background: #ffffff !important;
    border: 1px solid #E8E0D5 !important;
    border-radius: 16px !important;
    overflow: hidden !important;
    display: flex !important;
    flex-direction: column !important;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04) !important;
    transition: transform .12s, box-shadow .12s !important;
    position: relative !important;
    user-select: none !important;
  }
  .pos-card:active {
    transform: scale(0.97) !important;
  }
  .pos-card.in-cart {
    border-color: #9A3412 !important;
    box-shadow: 0 0 0 1.5px #9A3412, 0 3px 10px rgba(154,52,18,0.15) !important;
  }
  .pos-card-img-wrap {
    width: 100% !important;
    height: 125px !important;
    position: relative !important;
    background: #F7F3EA !important;
    overflow: hidden !important;
  }
  .pos-card img {
    width: 100% !important;
    height: 125px !important;
    object-fit: cover !important;
    display: block !important;
    transition: transform .2s ease !important;
  }
  .pos-card-img-ph {
    width: 100% !important;
    height: 125px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    font-size: 42px !important;
    background: #F3ECE1 !important;
  }
  .pos-card-body {
    padding: 10px 10px 12px !important;
    display: flex !important;
    flex-direction: column !important;
    gap: 4px !important;
    flex: 1 !important;
  }
  .pos-card-title {
    font-weight: 700 !important;
    font-size: 13.5px !important;
    color: #1C1917 !important;
    line-height: 1.35 !important;
    min-height: 36px !important;
    display: -webkit-box !important;
    -webkit-line-clamp: 2 !important;
    -webkit-box-orient: vertical !important;
    overflow: hidden !important;
  }
  .pos-card-footer {
    display: flex !important;
    align-items: center !important;
    justify-content: space-between !important;
    margin-top: auto !important;
    padding-top: 4px !important;
  }
  .pos-card-price {
    font-weight: 900 !important;
    font-size: 15px !important;
    color: #9A3412 !important;
  }
  .pos-card-add-btn {
    width: 36px !important;
    height: 36px !important;
    min-height: 36px !important;
    padding: 0 !important;
    border-radius: 50% !important;
    background: #9A3412 !important;
    color: #ffffff !important;
    border: 0 !important;
    font-size: 20px !important;
    font-weight: 800 !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    cursor: pointer !important;
    box-shadow: 0 3px 8px rgba(154,52,18,0.4) !important;
    transition: transform .1s, background .15s !important;
  }
  .pos-card-add-btn:active {
    transform: scale(0.9) !important;
    background: #7C2D12 !important;
  }
  .mob-cart-bar {
    display: none;
    position: fixed;
    bottom: 64px;
    left: 12px;
    right: 12px;
    background: #181512;
    color: #fff;
    border-radius: 16px;
    padding: 11px 18px;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    z-index: 45;
    cursor: pointer;
    border: 1px solid #38332B;
    animation: slideUp .2s ease-out;
  }
  .mob-cart-bar.active { display: flex !important; }

  /* Network status pill */
  .net-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 12px;
    background: #064E3B;
    color: #34D399;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: all .2s;
  }
  .net-badge.offline {
    background: #78350F;
    color: #FCD34D;
  }

    /* Top Action Bar for Clean Mobile Billing */
  .pos-top-action-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #ffffff;
    border: 1px solid #EBE4D8;
    border-radius: 12px;
    padding: 6px 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.03);
  }
  .pos-table-badge-btn {
    height: 36px !important;
    min-height: 36px !important;
    padding: 0 12px !important;
    border-radius: 8px !important;
    background: #FAF6F0 !important;
    border: 1px solid #D6CEBE !important;
    color: #1F1B16 !important;
    display: inline-flex !important;
    align-items: center !important;
    gap: 6px !important;
    cursor: pointer !important;
    flex: none !important;
    white-space: nowrap !important;
    font-weight: 700 !important;
    font-size: 13px !important;
  }
  .pos-top-search {
    width: 100%;
    height: 36px;
    min-height: 36px;
    border: 0;
    background: transparent;
    padding: 0 6px;
    font-size: 13.5px;
    color: #1F1B16;
    outline: none;
  }
  .pos-card-add-btn {
    width: 34px !important;
    height: 34px !important;
    min-height: 34px !important;
    padding: 0 !important;
    border-radius: 50% !important;
    background: #9A3412 !important;
    color: #ffffff !important;
    border: 0 !important;
    font-size: 20px !important;
    font-weight: 800 !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    cursor: pointer !important;

  }
  .pos-card-add-btn:active {
    transform: scale(0.9) !important;
    background: #7c2d12 !important;
  }

  /* Segmented order-type selector */
  .pos-type-bar {
    display: flex;
    background: #EFE8DA;
    padding: 3px;
    border-radius: 10px;
    gap: 4px;
    width: 100%;
  }
  .pos-type-pill {
    flex: 1;
    border: 0;
    background: transparent;
    padding: 8px 4px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    color: #57534E;
    cursor: pointer;
    text-align: center;
    transition: all .15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .pos-type-pill.on {
    background: #9A3412;
    color: #fff;
    box-shadow: 0 2px 4px rgba(154,52,18,0.25);
  }

  /* Horizontal table chips scroller */
  .table-scroll {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 2px 0 6px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .table-scroll::-webkit-scrollbar { display: none; }
  .table-chip {
    flex: none;
    height: 34px;
    padding: 0 12px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 700;
    border: 1px solid #D6CEBE;
    background: #fff;
    color: #1F1B16;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
  }
  .table-chip.on {
    background: #9A3412;
    color: #fff;
    border-color: #9A3412;
    box-shadow: 0 2px 4px rgba(154,52,18,0.25);
  }
  .table-chip.occupied {
    background: #FEE2E2;
    color: #991B1B;
    border-color: #FCA5A5;
  }

  /* Product card & components */
  .pos-card-img-wrap {
    width: 100%;
    height: 105px;
    position: relative;
    background: #F4EFE6;
    overflow: hidden;
    border-radius: 8px;
  }
  .pos-card-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .pos-card-img-ph {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;

    background: #EDE6D8;
  }
  .pos-card-body {
    padding: 2px 0 0;

    gap: 4px;

  }
  .pos-card-title {
    font-weight: 700;
    font-size: 13px;

  }

  /* Settings 3-tabs bar */
  .settings-tabs-bar {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    border-bottom: 1px solid #E6DED0;
    margin-bottom: 18px;
    scrollbar-width: none;
  }
  .settings-tabs-bar::-webkit-scrollbar { display: none; }
  .settings-tab-btn {
    min-height: 42px;
    border: 1px solid #D6CEBE;
    background: #fff;
    color: #1F1B16;
    border-radius: 10px;
    padding: 0 16px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;

  }
  .settings-tab-btn.on {
    background: #9A3412;
    color: #fff;
    border-color: #9A3412;
    box-shadow: 0 2px 6px rgba(154,52,18,0.25);

  /* ================= RESPONSIVE MOBILE STYLES ================= */
  @media (max-width: 768px) {
    .side { display: none !important; }
    .mob-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

/* ================= EXACT MOBILE APPLICATION STYLES ================= */
:root {

  --tx: #1C1917;
  --mu: #78716C;

}
@media(prefers-color-scheme: dark) {
  :root:not([data-theme=light]) {
    --bg: #14110F;
    --cd: #211C19;
    --tx: #F5F0EB;
    --mu: #A39B94;
    --ln: #352E2A;
    --bd: #352E2A;
    --wn: #3A2D12;
    --wt: #FCD34D;

}
:root[data-theme=dark] {
  --bg: #14110F;
  --cd: #211C19;
  --tx: #F5F0EB;
  --mu: #A39B94;
  --ln: #352E2A;
  --bd: #352E2A;
  --wn: #3A2D12;

<script>
// ================= AUTO CACHE BUSTER & STORAGE HELPERS =================
const CURRENT_VERSION = 'v15-mobile-parity'
try {
  if (localStorage.getItem('app_installed_version') !== CURRENT_VERSION) {
    localStorage.setItem('app_installed_version', CURRENT_VERSION)
    if ('caches' in window) {
      caches.keys().then((names) => {
        for (const name of names) {
          if (name.indexOf('restopos-img') === -1) caches.delete(name)
        }
      })
    }
  }
} catch {}

function lsGet(k, fallback) {
  try {
    const raw = localStorage.getItem(k)
    return raw ? JSON.parse(raw) : fallback
  } catch {
    return fallback
  }
}

function lsSet(k, val) {
  const s = typeof val === 'string' ? val : JSON.stringify(val)
  try {
    localStorage.setItem(k, s)
    return true
  } catch {
    try {
      // Prune stale heavy GET caches and retry
      for (let i = localStorage.length - 1; i >= 0; i--) {
        const key = localStorage.key(i)
        if (key && key.startsWith('cached_api_/api/report')) localStorage.removeItem(key)
      }
      localStorage.setItem(k, s)
      return true
    } catch {
      return false
    }
  }
}

function clearTenantCache() {
  try {
    sessionStorage.removeItem('tok')
    localStorage.removeItem('tok')
    localStorage.removeItem('cached_rid')
    localStorage.removeItem('cached_bootstrap')
    localStorage.removeItem('cached_tables')
    localStorage.removeItem('offline_bills_queue')
    localStorage.removeItem('restopos_active_orders')
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const k = localStorage.key(i)
      if (k && k.startsWith('cached_api_')) localStorage.removeItem(k)
    }
  } catch {}
}

function genClientUuid() {
  try {
    if (window.crypto && typeof window.crypto.randomUUID === 'function') return window.crypto.randomUUID()
  } catch {}
  return 'mob-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10)
}

function addDays(dateStr, deltaDays) {
  const d = parse(dateStr)
  d.setDate(d.getDate() + deltaDays)
  return fmt(d)
}

function calcOrderTotals(cart, discountVal, taxPercent) {
  const list = Array.isArray(cart) ? cart : []
  const subtotal = Math.round(list.reduce((s, x) => s + Number(x.price || 0) * Math.max(0, Number(x.qty) || 0), 0) * 100) / 100
  const discount = Math.min(Math.max(Number(discountVal) || 0, 0), subtotal)
  const taxPct = Math.max(Number(taxPercent) || 0, 0)
  const tax = Math.round((subtotal - discount) * taxPct) / 100
  const total = Math.round((subtotal - discount + tax) * 100) / 100
  return { subtotal, discount, tax, total, taxPct }
}

function computeKotDiff(cart, printedCart) {
  const prev = Array.isArray(printedCart) ? printedCart : []
  const newItems = []
  for (const c of (cart || [])) {
    const match = prev.find((p) => p.uid === c.uid || (p.variant_id === c.variant_id && (p.note || '') === (c.note || '')))
    const prevQty = match ? Number(match.qty || 0) : 0
    const diff = Number(c.qty || 0) - prevQty
    if (diff > 0) newItems.push({ ...c, qty: diff, is_addon: prevQty > 0 })
  }
  return newItems
}

const MENUS = {
  admin: ['Billing', 'Dashboard', 'Products', 'Reports', 'Settings'],
  manager: ['Billing', 'Dashboard', 'Products', 'Reports'],
  cashier: ['Billing']
}
function getUserRole() {
  return String((me && me.user && me.user.role) || (me && me.role) || 'admin').toLowerCase()
}
function getAllowedNav() {
  return MENUS[getUserRole()] || MENUS.cashier
}
function canAccessSection(sec) {
  return getAllowedNav().includes(sec)
}

const $ = (id) => document.getElementById(id)
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const rs = (n) => 'Rs ' + Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 })
const pad = (n) => String(n ?? 0).padStart(4, '0')
const p2 = (n) => String(n).padStart(2, '0')
const fmt = (d) => d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate())
const parse = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d) }
const today = () => fmt(new Date())
const main = $('main')

// Register Service Worker for offline PWA capability
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch((err) => console.log('SW reg error', err))
  })
}

// Persistent token (localStorage + sessionStorage)
let token = localStorage.getItem('tok') || sessionStorage.getItem('tok') || ''
const impName = sessionStorage.getItem('imp') || ''
if (!token && !localStorage.getItem('cached_bootstrap') && !localStorage.getItem('cached_api_/api/me')) location.replace('/')

function updateNetStatus() {
  const isOff = !navigator.onLine
  const b = $('mobNetBadge')
  if (b) {
    b.className = isOff ? 'net-badge offline' : 'net-badge'
    b.textContent = isOff ? '🟠 Offline' : '🟢 Online'
  }
}
window.addEventListener('online', () => {
  updateNetStatus()
  syncOfflineQueue()
  loadCatalog()
})
window.addEventListener('offline', updateNetStatus)

async function api(url, body, method) {
  const m = method || (body !== undefined ? 'POST' : 'GET')
  const opt = { method: m, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token } }
  if (body !== undefined && m !== 'GET') opt.body = JSON.stringify(body)
  let r
  try {
    r = await fetch(url, opt)
  } catch (err) {
    if (m === 'GET') {
      const cached = lsGet('cached_api_' + url, null)
      if (cached) return { ok: true, offline: true, ...cached }
    }
    return { ok: false, offline: true, status: 0, message: 'Offline mode: Cannot reach server' }
  }
  if (r.status === 401) {
    clearTenantCache()
    location.replace('/')
    return { ok: false, status: 401, message: 'Session expired. Please log in again.' }
  }
  try {
    const data = await r.json()
    data.status = r.status
    if (data.ok && m === 'GET' && !url.startsWith('/api/bootstrap')) {
      lsSet('cached_api_' + url, data)
    }
    return data
  } catch {
    return { ok: false, status: r.status, message: 'Server error (' + r.status + ')' }
  }
}

const NAV = ['Billing', 'Dashboard', 'Products', 'Reports', 'Settings']
const NAV_ICONS = { Billing: '🧾', Dashboard: '📊', Products: '🍔', Reports: '📑', Settings: '⚙️' }
let me = null, page = 'Billing'

function licStrip() {
  const l = me && me.license
  if (!l || !l.message) return ''
  if (l.state === 'active' && (l.days_left === 0 || l.message.includes('0 day'))) return ''
  if (window.innerWidth <= 768 && page === 'Billing') return ''
  const red = l.state !== 'active' || (l.days_left !== null && l.days_left < 0)
  return `<div class="lic" style="background:${red ? '#FEE2E2' : '#FEF3C7'};color:${red ? '#991B1B' : '#92400E'};padding:8px 14px;border-radius:10px;font-size:12.5px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px">
    <span>⚡ ${esc(l.message)}</span>
  </div>`
}
const kpi = (a, b) => `<div class="kpi"><span>${a}</span><b>${b}</b></div>`
const hbars = (rows) => {
  const max = Math.max(...rows.map((r) => r.value), 1)
  return rows.map((r) => `<div class="bar"><span class="n">${esc(r.name)}</span><div class="t"><i style="width:${(r.value / max) * 100}%"></i></div><span class="q">${r.value}</span></div>`).join('')
}
const paymentsHtml = (p) => p.length
  ? p.map((x) => `<div class="pay"><span>${esc(x.method)}</span><b>${rs(x.total)}</b></div>`).join('')
  : '<p class="muted">No sales in this period.</p>'

function go(p) {
  if (!canAccessSection(p)) p = 'Billing'
  page = p
  document.querySelectorAll('.nav').forEach((b) => b.classList.toggle('on', b.dataset.p === p))
  document.querySelectorAll('.mob-nav-btn').forEach((b) => b.classList.toggle('on', b.dataset.p === p))
  if (main) main.scrollTop = 0
  const mobBar = $('mobCartBar')
  if (mobBar && p !== 'Billing') mobBar.style.display = 'none'
  const viewFn = { Billing: viewBilling, Dashboard: viewDashboard, Products: viewProducts, Reports: viewReports, Settings: viewSettings }[p]
  if (viewFn) viewFn()
}

// ---------- Billing (POS) ----------

// ================= BLUETOOTH THERMAL PRINTER DRIVER (NATIVE SPP + WEB BLE) =================
let btDevice = null
let btCharacteristic = null
let btNativeConnected = false
let btNativeAddress = ''
let btPairedDevices = []
let btScanning = false
let btLastError = ''
let btPrinterName = localStorage.getItem('bt_printer_name') || ''
let btPrinterWidth = localStorage.getItem('bt_printer_width') || '58' // '58' or '80'
let btPendingResolve = null
let btPrintResolve = null

function hasNativeAndroidBt() {
  try {
    return !!(window.AndroidBT && typeof window.AndroidBT.isAvailable === 'function' && window.AndroidBT.isAvailable() === '1')
  } catch {
    return false
  }
}

function hasWebBluetooth() {
  return typeof navigator !== 'undefined' && !!navigator.bluetooth && typeof navigator.bluetooth.requestDevice === 'function'
}

function isBtConnected() {
  return !!(btNativeConnected || (btCharacteristic && btDevice && btDevice.gatt && btDevice.gatt.connected))
}

window.__onAndroidBtState = function (res) {
  if (!res) return
  if (res.connected) {
    btNativeConnected = true
    btNativeAddress = res.address || ''
    btPrinterName = res.name || btPrinterName || 'BT Printer'
    btLastError = ''
    lsSet('bt_printer_name', btPrinterName)
    if (btNativeAddress) lsSet('bt_printer_addr', btNativeAddress)
  } else {
    btNativeConnected = false
    if (res.message) btLastError = res.message
  }
  updateBtStatusUi()
  if (btPendingResolve) {
    const fn = btPendingResolve
    btPendingResolve = null
    fn(res)
  }
  if (window.innerWidth <= 768 && mobSheet && mobSheet.t === 'bt' && typeof renderMobile === 'function') renderMobile()
}

window.__onAndroidBtPrintResult = function (res) {
  if (btPrintResolve) {
    const fn = btPrintResolve
    btPrintResolve = null
    fn(res || { ok: false })
  }
}

function initBtBridge() {
  if (hasNativeAndroidBt()) {
    try {
      const st = JSON.parse(window.AndroidBT.getStatus() || '{}')
      btNativeConnected = !!st.connected
      if (st.connected) {
        btNativeAddress = st.address || ''
        btPrinterName = st.name || btPrinterName
      }
    } catch {}
  }
  updateBtStatusUi()
}

function updateBtStatusUi() {
  const btn = $('btHeaderBtn')
  if (!btn) return
  if (isBtConnected()) {
    btn.className = 'mob-bt-btn connected'
    btn.textContent = btPrinterName || 'Printer Ready'
  } else if (btPrinterName) {
    btn.className = 'mob-bt-btn'
    btn.textContent = 'Reconnect'
  } else {
    btn.className = 'mob-bt-btn'
    btn.textContent = 'Connect BT'
  }
}

function scanAndroidBtDevices() {
  btLastError = ''
  if (!hasNativeAndroidBt()) return { ok: false, message: 'Native Android Bluetooth is only available in the APK.' }
  try {
    if (window.AndroidBT.isEnabled() !== '1') {
      btLastError = 'Please turn ON Bluetooth in Android settings.'
      return { ok: false, message: btLastError, devices: [] }
    }
    if (window.AndroidBT.hasPermission() !== '1') {
      window.AndroidBT.requestPermission()
      btLastError = 'Bluetooth permission requested. Allow it and tap Refresh Devices.'
      return { ok: false, needPermission: true, message: btLastError, devices: [] }
    }
    const res = JSON.parse(window.AndroidBT.getPairedDevices() || '{}')
    if (res.ok) {
      btPairedDevices = Array.isArray(res.devices) ? res.devices : []
    } else {
      btLastError = res.message || 'Failed to read paired printers.'
    }
    return res
  } catch (e) {
    btLastError = e.message || 'Bluetooth scan failed.'
    return { ok: false, message: btLastError, devices: [] }
  }
}

function connectAndroidBtDevice(address) {
  return new Promise((resolve) => {
    if (!hasNativeAndroidBt()) return resolve({ ok: false, message: 'Native Android Bluetooth unavailable.' })
    if (!address) return resolve({ ok: false, message: 'Select a Bluetooth printer first.' })
    btScanning = true
    btLastError = ''
    let timer = setTimeout(() => {
      if (btPendingResolve) {
        btPendingResolve = null
        btScanning = false
        resolve({ ok: false, message: 'Connection timed out. Ensure printer is turned ON and nearby.' })
      }
    }, 10000)
    btPendingResolve = (res) => {
      clearTimeout(timer)
      btScanning = false
      resolve({ ok: !!(res && res.connected), ...res })
    }
    try {
      const start = JSON.parse(window.AndroidBT.connect(address) || '{}')
      if (start && start.ok === false) {
        clearTimeout(timer)
        btPendingResolve = null
        btScanning = false
        btLastError = start.message || 'Failed to start connection'
        resolve(start)
      }
    } catch (e) {
      clearTimeout(timer)
      btPendingResolve = null
      btScanning = false
      btLastError = e.message || 'Connection error'
      resolve({ ok: false, message: btLastError })
    }
  })
}

async function connectBluetoothPrinter() {
  btLastError = ''
  if (hasNativeAndroidBt()) {
    const scan = scanAndroidBtDevices()
    if (!scan.ok) {
      if (window.innerWidth <= 768 && typeof showMobToast === 'function') showMobToast(scan.message || 'Bluetooth unavailable')
      else alert(scan.message)
      return false
    }
    const savedAddr = localStorage.getItem('bt_printer_addr') || ''
    if (savedAddr && btPairedDevices.some((d) => d.address === savedAddr)) {
      const res = await connectAndroidBtDevice(savedAddr)
      if (res.ok) {
        if (window.innerWidth <= 768 && typeof showMobToast === 'function') showMobToast('Connected to ' + btPrinterName)
        return true
      }
    }
    if (window.innerWidth <= 768 && typeof renderMobile === 'function') {
      mobSheet = { t: 'bt' }
      renderMobile()
    }
    return false
  }
  if (!hasWebBluetooth()) {
    const msg = 'Chrome Web Bluetooth only connects BLE printers over HTTPS. For Classic Bluetooth printers (Xprinter, POS-58, Goojprt), use the Restaurant POS Android APK or tap System Print.'
    btLastError = msg
    if (window.innerWidth <= 768 && typeof showMobToast === 'function') showMobToast('BLE unavailable here — see printer tips')
    else alert(msg)
    return false
  }
  try {
    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [
        '000018f0-0000-1000-8000-00805f9b34fb',
        'e7810a71-73ae-499d-8c15-faa9aef0c3f2',
        '49535343-fe7d-4ae5-8fa9-9fafd205e455',
        '0000ffe0-0000-1000-8000-00805f9b34fb',
        '0000ff00-0000-1000-8000-00805f9b34fb',
        '0000ae30-0000-1000-8000-00805f9b34fb'
      ]
    })
    const server = await device.gatt.connect()
    device.addEventListener('gattserverdisconnected', () => {
      btCharacteristic = null
      updateBtStatusUi()
      if (window.innerWidth <= 768 && typeof renderMobile === 'function') renderMobile()
    })
    let foundChar = null
    const services = await server.getPrimaryServices()
    for (const service of services) {
      const chars = await service.getCharacteristics()
      for (const c of chars) {
        if (c.properties.write || c.properties.writeWithoutResponse) {
          foundChar = c
          break
        }
      }
      if (foundChar) break
    }
    if (!foundChar) {
      btLastError = 'Printer does not expose a writable BLE GATT characteristic.'
      alert(btLastError)
      return false
    }
    btDevice = device
    btCharacteristic = foundChar
    btPrinterName = device.name || 'BLE Printer'
    localStorage.setItem('bt_printer_name', btPrinterName)
    updateBtStatusUi()
    if (window.innerWidth <= 768 && typeof showMobToast === 'function') {
      showMobToast('Connected to ' + btPrinterName)
      renderMobile()
    } else {
      alert('Connected successfully to ' + btPrinterName)
      closeModal()
    }
    return true
  } catch (err) {
    if (err && err.name !== 'NotFoundError') {
      btLastError = err.message || 'Bluetooth connection failed.'
      if (window.innerWidth <= 768 && typeof showMobToast === 'function') showMobToast(btLastError)
      else alert('Bluetooth connection failed: ' + btLastError)
    }
    return false
  }
}

function disconnectBluetoothPrinter() {

function uint8ToBase64(u8) {
  let bin = ''
  for (let i = 0; i < u8.length; i++) bin += String.fromCharCode(u8[i])
  return btoa(bin)
}

function cleanPrintText(str) {
  return String(str || '').replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F1E0}-\u{1F1FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{FE00}-\u{FE0F}\u{1F900}-\u{1F9FF}\u{1FA70}-\u{1FAFF}]/gu, '').trim()
}

// Convert receipt into ESC/POS bytes
function generateEscPosBytes(bill, s) {
  const enc = new TextEncoder()
  const bytes = []
  const push = (arr) => { for (const b of arr) bytes.push(b) }
  const pushText = (str) => {
    const b = enc.encode(str)
    for (const x of b) bytes.push(x)
  }

  const is58 = btPrinterWidth === '58'
  const colWidth = is58 ? 32 : 48
  const dash = '-'.repeat(colWidth) + '\n'
  const padRow = (label, val) => {
    const l = String(label || '').slice(0, colWidth - 12)
    const v = String(val || '')
    return l + ' '.repeat(Math.max(1, colWidth - l.length - v.length)) + v + '\n'
  }

  push([0x1B, 0x40]) // ESC @
  push([0x1B, 0x61, 0x01]) // Center

  push([0x1B, 0x21, 0x18])
  pushText((cleanPrintText(s.restaurant_name) || 'RESTAURANT POS') + '\n')
  push([0x1B, 0x21, 0x00])
  if (s.address) pushText(cleanPrintText(s.address) + '\n')
  if (s.phone) pushText('Tel: ' + cleanPrintText(s.phone) + '\n')
  pushText(dash)

  push([0x1B, 0x21, 0x08])
  pushText(`Bill #: ${pad(bill.bill_no)}\n`)
  if (bill.token_no) pushText(`Token #: ${bill.token_no}\n`)
  push([0x1B, 0x21, 0x00])
  pushText(dash)

  push([0x1B, 0x61, 0x00]) // Left
  pushText(`Date: ${bill.created_at || new Date().toLocaleString()}\n`)
  pushText(`Type: ${cleanPrintText(bill.order_type) || 'Dine-in'}\n`)
  if (bill.table_name) pushText(`Table: ${cleanPrintText(bill.table_name)}\n`)
  if (bill.waiter_name) pushText(`Waiter: ${cleanPrintText(bill.waiter_name)}\n`)
  if (bill.guests > 1) pushText(`Guests: ${bill.guests}\n`)
  pushText(dash)

  push([0x1B, 0x21, 0x08])
  pushText(is58 ? 'Item            Qty       Amount\n' : 'Item                         Qty          Amount\n')
  push([0x1B, 0x21, 0x00])
  pushText(dash)

  for (const item of (bill.items || [])) {
    const wName = is58 ? 16 : 26
    const wAmt = is58 ? 12 : 18
    const cleanName = cleanPrintText(item.name)
    const nameLine = cleanName.slice(0, wName).padEnd(wName)
    const qtyLine = String(item.qty).padStart(3)
    const amtLine = String(Math.round(Number(item.qty) * Number(item.price))).padStart(wAmt)
    pushText(nameLine + qtyLine + amtLine + '\n')
    if (cleanName.length > wName) pushText(' ' + cleanName.slice(wName, wName * 2) + '\n')
    if (item.note) {
      const cleanNote = cleanPrintText(item.note)
      if (cleanNote) {
        cleanNote.split('\n').map((l) => l.trim()).filter(Boolean).forEach((line) => {
          const raw = line.replace(/^[•\-\*\s]+/, '').trim()
          if (raw) pushText('  * ' + raw + '\n')
        })
      }
    }
  }
  pushText(dash)

  pushText(padRow('Subtotal:', rs(bill.subtotal)))
  if (Number(bill.discount) > 0) pushText(padRow('Discount:', '-' + rs(bill.discount)))
  if (Number(bill.tax) > 0) pushText(padRow('Tax:', rs(bill.tax)))

  push([0x1B, 0x21, 0x18])
  pushText(padRow('TOTAL:', rs(bill.total)))
  push([0x1B, 0x21, 0x00])
  pushText(padRow('Payment:', cleanPrintText(bill.payment_method || 'Cash')))
  if (bill.payment_method === 'Split' && (Number(bill.cash_amount) > 0 || Number(bill.online_amount) > 0)) {
    pushText(padRow('  Cash / Online:', `${Number(bill.cash_amount || 0)} / ${Number(bill.online_amount || 0)}`))
  }
  pushText(dash)

  push([0x1B, 0x61, 0x01])
  pushText((cleanPrintText(s.footer) || 'Thank you! Visit again.') + '\n')
  pushText('\n\n\n')
  push([0x1D, 0x56, 0x41, 0x10])

  return new Uint8Array(bytes)
}

function generateEscPosKotBytes(kot, s) {
  const enc = new TextEncoder()
  const bytes = []
  const push = (arr) => { for (const b of arr) bytes.push(b) }
  const pushText = (str) => {
    const b = enc.encode(str)
    for (const x of b) bytes.push(x)
  }

  const is58 = btPrinterWidth === '58'
  const colWidth = is58 ? 32 : 48
  const dash = '-'.repeat(colWidth) + '\n'
  const title = kot.kot_title || (kot.kot_seq > 1 ? `KOT #${kot.kot_seq} (ADD-ON ITEMS)` : `KITCHEN ORDER (KOT #${kot.kot_seq || 1})`)

  push([0x1B, 0x40])
  push([0x1B, 0x61, 0x01])
  push([0x1B, 0x21, 0x18])
  pushText(title + '\n')
  push([0x1B, 0x21, 0x00])
  pushText((cleanPrintText(s.restaurant_name) || 'RESTAURANT POS') + '\n')
  pushText(dash)

  push([0x1B, 0x61, 0x00])
  push([0x1B, 0x21, 0x08])
  if (kot.table_name) pushText(`TABLE: ${cleanPrintText(kot.table_name)}\n`)
  if (kot.token_no) pushText(`TOKEN: #${kot.token_no}\n`)
  if (kot.waiter_name) pushText(`WAITER: ${cleanPrintText(kot.waiter_name)}\n`)
  push([0x1B, 0x21, 0x00])
  pushText(`TIME: ${new Date().toLocaleTimeString()}\n`)
  pushText(dash)

  push([0x1B, 0x21, 0x08])
  pushText(is58 ? 'Item                         Qty\n' : 'Item                                         Qty\n')
  push([0x1B, 0x21, 0x00])
  pushText(dash)

  for (const item of (kot.items || [])) {
    const wName = is58 ? 25 : 39
    const prefix = item.is_addon ? '[ADD] ' : ''
    const cleanName = prefix + cleanPrintText(item.name)
    const nameLine = cleanName.slice(0, wName).padEnd(wName)
    const qtyLine = ('x ' + item.qty).padStart(is58 ? 7 : 9)
    push([0x1B, 0x21, 0x08])
    pushText(nameLine + qtyLine + '\n')
    push([0x1B, 0x21, 0x00])
    if (cleanName.length > wName) pushText(' ' + cleanName.slice(wName, wName * 2) + '\n')
    if (item.note) {
      const cleanNote = cleanPrintText(item.note)
      if (cleanNote) {
        cleanNote.split('\n').map((l) => l.trim()).filter(Boolean).forEach((line) => {
          const raw = line.replace(/^[•\-\*\s]+/, '').trim()
          if (raw) pushText('  * ' + raw + '\n')
        })
      }
    }
  }

  pushText(dash + '\n\n\n')
  push([0x1D, 0x56, 0x41, 0x10])
  return new Uint8Array(bytes)
}

async function sendBytesToBluetooth(byteArray) {
  if (hasNativeAndroidBt() && btNativeConnected) {
    return new Promise((resolve) => {
      const b64 = uint8ToBase64(byteArray)
      const t = setTimeout(() => { btPrintResolve = null; resolve(false) }, 8000)
      btPrintResolve = (res) => { clearTimeout(t); resolve(!!(res && res.ok)) }
      try {
        const res = JSON.parse(window.AndroidBT.printBase64(b64) || '{}')
        if (res && res.ok === false) { clearTimeout(t); btPrintResolve = null; resolve(false) }
      } catch {
        clearTimeout(t); btPrintResolve = null; resolve(false)
      }
    })
  }
  if (!btCharacteristic) return false
  let chunkSize = 80
  try {
    for (let i = 0; i < byteArray.length; i += chunkSize) {
      const chunk = byteArray.slice(i, i + chunkSize)
      if (btCharacteristic.writeValueWithoutResponse) await btCharacteristic.writeValueWithoutResponse(chunk)
      else await btCharacteristic.writeValue(chunk)
      await new Promise((r) => setTimeout(r, 20))
    }
    return true
  } catch {
    // Fallback to conservative 20-byte BLE MTU packets
    chunkSize = 20
    for (let i = 0; i < byteArray.length; i += chunkSize) {
      const chunk = byteArray.slice(i, i + chunkSize)
      if (btCharacteristic.writeValueWithoutResponse) await btCharacteristic.writeValueWithoutResponse(chunk)
      else await btCharacteristic.writeValue(chunk)
      await new Promise((r) => setTimeout(r, 25))
    }
    return true
  }
}

function printThermalHtml(html) {
  let iframe = document.getElementById('pos-print-frame')
  if (!iframe) {
    iframe = document.createElement('iframe')
    iframe.id = 'pos-print-frame'
    iframe.style.position = 'fixed'
    iframe.style.right = '0'
    iframe.style.bottom = '0'
    iframe.style.width = '0'
    iframe.style.height = '0'
    iframe.style.border = '0'
    document.body.appendChild(iframe)
  }
  const doc = iframe.contentWindow.document
  doc.open()
  doc.write(html)
  doc.close()
  setTimeout(() => {
    try {
      iframe.contentWindow.focus()
      iframe.contentWindow.print()
    } catch (e) {
      console.error('Print failed:', e)
    }
  }, 250)
}

async function loadBillingData() {
  const [catRes, waitRes, setRes, tblRes, actRes] = await Promise.all([
    loadCatalog(),
    api('/api/waiters'),
    api('/api/settings'),
    api('/api/tables'),
    api('/api/active-orders')
  ])
  if (waitRes && waitRes.ok) waitersList = waitRes.waiters || []
  if (setRes && setRes.ok && setRes.settings) settingsCache = setRes.settings
  if (tblRes && tblRes.ok && Array.isArray(tblRes.tables) && tblRes.tables.length) {
    tablesList = tblRes.tables
    lsSet('cached_tables', tablesList)
  }
  if (actRes && actRes.ok && Array.isArray(actRes.active_orders)) {
    activeOrders = actRes.active_orders
    saveActiveOrdersStore()
    rebuildHeldTablesMap()
  }
}

async function viewBilling() {
  if (!catalog.products.length) {
    main.innerHTML = '<div class="pad muted">Loading billing products & tables...</div>'
    await loadBillingData()
  } else {
    loadBillingData() // background refresh
  }
  drawBilling()
}

function addCartItem(prod, v) {
  const existing = billCart.find((x) => x.variant_id === v.id && !x.note)
  if (existing) {
    existing.qty++
  } else {
    billCart.push({
      uid: Date.now() + Math.random().toString(36).substr(2, 4),
      product_id: prod.id,
      variant_id: v.id,
      name: v.name ? `${prod.name} (${v.name})` : prod.name,
      price: Number(v.price || 0),
      qty: 1,
      note: ''
    })
  }
  drawBilling()
}

function getFoodIcon(name) {
  const n = String(name || '').toLowerCase()
  if (n.includes('burg') || n.includes('patty')) return '🍔'
  if (n.includes('drink') || n.includes('cola') || n.includes('7up') || n.includes('sprite') || n.includes('soda') || n.includes('water') || n.includes('pepsi') || n.includes('sting')) return '🥤'
  if (n.includes('shawarma') || n.includes('roll') || n.includes('wrap')) return '🌯'
  if (n.includes('pizza')) return '🍕'
  if (n.includes('roti') || n.includes('naan') || n.includes('paratha')) return '🫓'
  if (n.includes('chai') || n.includes('tea') || n.includes('coffee') || n.includes('caffe')) return '☕'
  if (n.includes('chany') || n.includes('karahi') || n.includes('desi') || n.includes('handi') || n.includes('salan') || n.includes('biryani') || n.includes('rice')) return '🍛'
  if (n.includes('sweet') || n.includes('ice') || n.includes('kheer')) return '🍨'
  return '🍽️'
}

// ---------- Dashboard ----------
let dashCache = null

function getLowStockVariants() {
  const list = []
  for (const p of (catalog.products || [])) {
    if (!p.track_stock) continue
    const cat = (catalog.categories || []).find((c) => c.id === p.category_id)
    for (const v of (p.variants || [])) {
      const st = Number(v.stock ?? 0)
      const mst = Number(v.min_stock ?? 5)
      if (st <= mst) {
        list.push({
          product_id: p.id,
          variant_id: v.id,
          product_name: p.name,
          variant_name: v.name,
          display_name: v.name ? `${p.name} (${v.name})` : p.name,
          image: p.image,
          category_name: cat ? cat.name : '',
          stock: st,
          min_stock: mst,
          isOut: st <= 0
        })
      }
    }
  }
  return list
}

function renderDashboard(d) {
  const s = d.summary
  const lowList = getLowStockVariants()
  const lowStockHtml = lowList.length ? `
    <div style="background:#FFFBEB;border:1px solid #FCD34D;border-radius:12px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:22px">⚠️</span>
        <div>
          <b style="color:#92400E;font-size:15px">${lowList.length} Item(s) Low on Stock!</b>
          <div style="font-size:13px;color:#78350F;margin-top:2px">${lowList.map((v) => `${esc(v.display_name)} (${v.stock} left)`).slice(0, 3).join(', ')}${lowList.length > 3 ? '...' : ''}</div>
        </div>
      </div>
      <button class="btn" style="background:#FEF3C7;border-color:#F59E0B;color:#92400E;font-weight:700" data-a="golowstock">Manage Stock →</button>
    </div>` : ''

  main.innerHTML = `<div class="pad">${licStrip()}${lowStockHtml}<h2>Today at a glance</h2>
    <div class="row">${kpi("Today's sales", rs(s.sales))}${kpi('Customers', s.guests)}${kpi('Items sold', s.items_sold)}</div>
    <div class="row top">
      <div class="card grow2"><b>All items sold today (quantity)</b>
        ${d.items.length ? hbars(d.items.map((i) => ({ name: i.name, value: i.qty }))) : '<p class="muted">No sales yet today.</p>'}</div>
      <div class="card grow1"><b>Payments received</b>${paymentsHtml(d.payments)}</div>
    </div></div>`
}

async function viewDashboard() {
  if (dashCache) renderDashboard(dashCache)
  else main.innerHTML = '<div class="pad muted">Loading...</div>'
  const t = today()
  const [d] = await Promise.all([
    api(`/api/report?from=${t}&to=${t}`),
    loadCatalog()
  ])
  if (!d.ok) {
    if (!dashCache) main.innerHTML = `<div class="pad err">${esc(d.message)}</div>`
    return
  }
  dashCache = d
  if (page === 'Dashboard') renderDashboard(d)
}

      const tid = v.variant_id || v.product_id

        </div>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <label style="font-size:13px;font-weight:600">Stock:

function productListHtml() {
  const list = catalog.products.filter((p) => p.category_id === prodCat && p.name.toLowerCase().includes(prodSearch.toLowerCase()))
  if (!list.length) return '<p class="muted" style="margin-top:20px">No products here yet. Click Add product.</p>'
  return list.map((p) => {
    let stockChip = ''
    if (p.track_stock) {
      const st = Number(p.stock)
      const mst = Number(p.min_stock ?? 5)
      if (st <= 0) {
        stockChip = '<span class="chip" style="background:#FEE2E2;color:#991B1B;font-weight:700">🔴 Out of stock (0)</span>'
      } else if (st <= mst) {
        stockChip = `<span class="chip" style="background:#FEF3C7;color:#92400E;font-weight:700">⚠️ Low stock (${st} left)</span>`
      } else {
        stockChip = `<span class="chip" style="background:#ECFDF5;color:#065F46;font-weight:600">📦 Total stock: ${st}</span>`
      }
    }
    return `<div class="prod">
      ${p.image ? `<img src="${esc(p.image)}" alt="">` : '<div class="ph">Photo</div>'}
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <b style="font-size:16px">${esc(p.name)}</b>
          ${stockChip}
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">${p.variants.map((v) => {
          const varStk = p.track_stock ? ` • ${v.stock ?? 0} in stock` : ''
          return `<span class="chip">${v.name ? esc(v.name) + ': ' : ''}${rs(v.price)}${varStk}</span>`
        }).join('')}</div>
      </div>
      <button class="btn" data-a="editprod" data-id="${esc(p.id)}">Edit</button>
      <button class="btn red" data-a="delprod" data-id="${esc(p.id)}">Delete</button></div>`
  }).join('')
}

function readDraft() {
  draft.name = $('pn').value
  draft.category_id = $('pc').value
  const ts = $('p_track_stock')
  draft.track_stock = ts ? ts.checked : false
  draft.variants = Array.from(document.querySelectorAll('#vars .vrow')).map((r, i) => {
    const existing = draft.variants[i] || {}
    return {
      id: existing.id || '',
      name: r.querySelector('.vn').value,
      price: r.querySelector('.vp').value,
      stock: r.querySelector('.vs') ? Math.max(0, parseInt(r.querySelector('.vs').value, 10) || 0) : (existing.stock ?? 0),
      min_stock: r.querySelector('.vms') ? Math.max(0, parseInt(r.querySelector('.vms').value, 10) || 0) : (existing.min_stock ?? 5)
    }
  })
  draft.stock = draft.track_stock ? draft.variants.reduce((sum, v) => sum + (v.stock || 0), 0) : 0
  draft.min_stock = draft.variants.length ? Math.min(...draft.variants.map((v) => v.min_stock)) : 5
}

function resizeImage(file) {
  return new Promise((resolve) => {
    const img = new Image()
    img.onload = () => {
      const max = 320
      let w = img.width, h = img.height
      if (w > max || h > max) {
        if (w > h) { h = Math.round((h * max) / w); w = max }
        else { w = Math.round((w * max) / h); h = max }
      }
      const cv = document.createElement('canvas')
      cv.width = w; cv.height = h
      cv.getContext('2d').drawImage(img, 0, 0, w, h)
      resolve(cv.toDataURL('image/jpeg', 0.75))
    }
    const rd = new FileReader()
    rd.onload = (e) => (img.src = e.target.result)
    rd.readAsDataURL(file)
  })
}

// ---------- Reports ----------
const rep = { period: 'day', date: today(), month: today().slice(0, 7), year: today().slice(0, 4), from: today(), to: today(), data: null, range: null, limit: 100 }

function repControls() {
  const p = rep.period
  const btn = (k, l) => `<button class="${p === k ? 'on' : ''}" data-a="period" data-p="${k}">${l}</button>`
  let sub = ''
  if (p === 'day') sub = `<input type="date" id="rdate" class="inp" value="${rep.date}">`
  if (p === 'month') sub = `<input type="month" id="rmonth" class="inp" value="${rep.month}">`
  if (p === 'year') {
    const y = Number(today().slice(0, 4))
    const opts = [y, y - 1, y - 2].map((x) => `<option value="${x}" ${String(x) === rep.year ? 'selected' : ''}>${x}</option>`).join('')
    sub = `<select id="ryear" class="inp">${opts}</select>`
  }
  if (p === 'custom') sub = `<input type="date" id="rfrom" class="inp" value="${rep.from}"><span class="muted">to</span><input type="date" id="rto" class="inp" value="${rep.to}">`
  $('repCtl').innerHTML = `<div class="tabs">${btn('day', 'Day')}${btn('month', 'Month')}${btn('year', 'Year')}${btn('custom', 'Custom range')}</div><div class="ctl">${sub}</div>`
}

function repRange() {
  const p = rep.period
  if (p === 'day') return { from: rep.date, to: rep.date }
  if (p === 'month') {
    const [y, m] = rep.month.split('-').map(Number)
    const last = new Date(y, m, 0).getDate()
    return { from: `${rep.month}-01`, to: `${rep.month}-${p2(last)}` }
  }
  if (p === 'year') return { from: `${rep.year}-01-01`, to: `${rep.year}-12-31` }
  return { from: rep.from, to: rep.to }
}

async function viewReports() {
  main.innerHTML = `<div class="pad">${licStrip()}

    <div id="repCtl" class="row" style="align-items:center"></div><div id="repOut"></div></div>`
  repControls()
  loadReport()

async function loadReport() {
  const r = repRange()
  const ok = /^\d{4}-\d{2}-\d{2}$/.test(r.from) && /^\d{4}-\d{2}-\d{2}$/.test(r.to) && r.from <= r.to && Number(r.from.slice(0, 4)) > 1999
  if (!ok) { $('repOut').innerHTML = '<p class="err">Choose a valid date range (From must not be after To).</p>'; return }
  if (!rep.data) $('repOut').innerHTML = '<p class="muted">Loading...</p>'
  const d = await api(`/api/report?from=${r.from}&to=${r.to}&bills=1`)
  if (!d.ok) { $('repOut').innerHTML = `<p class="err">${esc(d.message)}</p>`; return }
  rep.data = d; rep.range = r; rep.limit = 100
  drawReport()
}

function drawReport() {
  const d = rep.data, r = rep.range, s = d.summary
  const when = (b) => (r.from === r.to ? b.created_at.slice(11, 16) : b.created_at.slice(0, 10) + '  ' + b.created_at.slice(11, 16))
  const shown = d.bills.slice(0, rep.limit)
  $('repOut').innerHTML = `<div class="muted">Showing ${r.from === r.to ? r.from : r.from + ' to ' + r.to}</div>
    <div class="row" style="margin-top:12px">${kpi('Total sales', rs(s.sales))}${kpi('Customers', s.guests)}${kpi('Items sold', s.items_sold)}
      ${d.payments.map((p) => kpi(esc(p.method) + ' payments', rs(p.total))).join('')}</div>
    <div class="card" style="margin-top:16px"><b>All customers</b>
      ${d.bills.length ? shown.map((b) => `<div class="bill">
        <div class="l"><b>Bill ${pad(b.bill_no)}</b><div class="muted">${esc(when(b))}</div><div class="muted">${esc(b.order_type || '')}${b.table_name ? ' - Table ' + esc(b.table_name) : ''}</div></div>
        <div class="m">${(b.items || []).map((i) => `<div class="li"><span>${esc(i.name)} x ${i.qty}</span><span class="muted">${rs(i.qty * i.price)}</span></div>`).join('')}
          ${b.discount > 0 || b.tax > 0 ? `<div class="muted" style="font-size:12px;margin-top:4px">${b.discount > 0 ? 'Discount ' + rs(b.discount) : ''}${b.discount > 0 && b.tax > 0 ? '  |  ' : ''}${b.tax > 0 ? 'Tax ' + rs(b.tax) : ''}</div>` : ''}</div>
        <div class="r"><b style="font-size:17px">${rs(b.total)}</b><div class="muted">${esc(b.payment_method)}</div></div></div>`).join('')
        : '<p class="muted">No sales in this period.</p>'}
      ${d.bills.length > rep.limit ? `<div style="text-align:center;padding-top:14px"><button class="btn" data-a="more">Show more (${d.bills.length - rep.limit} remaining)</button></div>` : ''}</div>`
}

function exportCsv() {
  if (!rep.data) return
  const d = rep.data, r = rep.range, q = (s) => `"${String(s ?? '').replace(/"/g, '""')}"`
  const lines = [`Report,${r.from} to ${r.to}`, `Total sales,${d.summary.sales}`, `Customers,${d.summary.guests}`,
    ...d.payments.map((p) => `${p.method} payments,${p.total}`), '', 'Bill ID,Date,Time,Type,Table,Items,Payment,Amount',
    ...d.bills.map((b) => [pad(b.bill_no), b.created_at.slice(0, 10), b.created_at.slice(11, 16), q(b.order_type), q(b.table_name),
      q((b.items || []).map((i) => `${i.name} x ${i.qty}`).join('; ')), q(b.payment_method), b.total].join(','))]
  const a = document.createElement('a')
  a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/csv' }))
  a.download = `report-${r.from}-to-${r.to}.csv`
  a.click()
}

  possavetableorder: async () => {
    if (!billCart.length) {
      alert('Please add items to order first')
      return
    }
    if (!billTable) billTable = 'Table 1'
    billOrderType = 'Dine-in'
    const totals = calcOrderTotals(billCart, billDiscount, settingsCache.tax_percent || 0)
    const tokenNo = billTokenNo || String(curOrderNo || Math.floor(100 + Math.random() * 900))
    billTokenNo = tokenNo
    const payload = {
      table_name: billTable,
      order_type: 'Dine-in',
      waiter_name: billWaiter || '',
      guests: Number(billGuests || 1),
      discount: Number(billDiscount || 0),
      tax_percent: Number(settingsCache.tax_percent || 0),
      cart: JSON.parse(JSON.stringify(billCart)),
      printed_cart: JSON.parse(JSON.stringify(billPrintedCart)),
      kot_seq: Number(billKotSeq || 0),
      token_no: tokenNo
    }
    const r = await api('/api/active-orders', payload)
    const orderData = {
      ...payload,
      waiter: billWaiter || '',
      order_no: tokenNo,
      total: totals.total,
      updated_at: new Date().toLocaleTimeString()
    }
    const existingIdx = activeOrders.findIndex((ao) => ao.table_name === billTable)
    if (existingIdx >= 0) activeOrders[existingIdx] = orderData
    else activeOrders.push(orderData)
    saveActiveOrdersStore()
    rebuildHeldTablesMap()
    billToast = r.ok
      ? `Saved running order on ${billTable} (Order #${pad(tokenNo)}). Table is now held.`
      : `Saved locally on ${billTable} (offline cache).`
    drawBilling()
    if (window.innerWidth <= 768) renderMobile()
  },
  posmovetable: async () => {
    if (!billTable) return
    const target = prompt(`Move active order from ${billTable} to which table? (e.g. Table 2):`, '')
    if (!target || !target.trim() || target.trim() === billTable) return
    const nextTable = target.trim()
    const r = await api('/api/active-orders/move', { from_table: billTable, to_table: nextTable })
    if (r && r.status >= 400 && !r.ok) return alert(r.message || 'Could not move table')
    const activeIdx = activeOrders.findIndex((ao) => ao.table_name === billTable)
    if (activeIdx >= 0) {
      activeOrders[activeIdx].table_name = nextTable
      saveActiveOrdersStore()
    }
    rebuildHeldTablesMap()
    billTable = nextTable
    billToast = `Order moved to ${billTable}.`
    drawBilling()
    if (window.innerWidth <= 768) renderMobile()
  },

  posprintfinal: async (d) => {
    const isNoPrint = (d && d.noPrint) === true
    if (!billCart.length || billSubmitting) return
    billSubmitting = true
    const totals = calcOrderTotals(billCart, billDiscount, settingsCache.tax_percent || 0)
    const cashAmt = billPayment === 'Cash' ? totals.total : (billPayment === 'Split' ? Math.max(0, Number(billCashAmount || 0)) : 0)
    const onlineAmt = billPayment === 'Online / Card' ? totals.total : (billPayment === 'Split' ? Math.max(0, Number(billOnlineAmount || (totals.total - cashAmt))) : 0)
    const payload = {
      id: billClientUuid || genClientUuid(),
      order_type: billOrderType,
      table_name: billOrderType === 'Dine-in' ? billTable : '',
      waiter_name: billWaiter,
      guests: billOrderType === 'Dine-in' ? (Number(billGuests) || 1) : 1,
      tax_percent: totals.taxPct,
      subtotal: totals.subtotal,
      discount: totals.discount,
      tax: totals.tax,
      total: totals.total,
      payment_method: billPayment,
      cash_amount: cashAmt,
      online_amount: onlineAmt,
      token_no: billTokenNo || '',
      items: billCart.map((i) => ({
        product_id: i.product_id || null,
        variant_id: i.variant_id || null,
        name: i.name,
        price: Number(i.price || 0),
        qty: Math.max(1, Number(i.qty || 1)),
        note: i.note || ''
      }))
    }

    let billSaved = null
    const r = await api('/api/orders', payload)
    billSubmitting = false
    if (r.ok && r.bill) {
      billSaved = r.bill
      lastBillId = r.bill.id
      billToast = isNoPrint
        ? `Bill #${pad(r.bill.bill_no)} saved!`
        : `Bill #${pad(r.bill.bill_no)} saved & printed!`
    } else if (!r.offline && r.status && r.status >= 400 && r.status < 500) {
      alert(r.message || 'Could not save bill. Please check your items and stock.')
      return
    } else {
      const offNo = Math.floor(Math.random() * 8999) + 1000
      billSaved = {
        bill_no: offNo,
        created_at: new Date().toLocaleString(),
        ...payload
      }
      const q = lsGet('offline_bills_queue', [])
      if (!q.some((x) => x.id === payload.id)) q.push(payload)
      lsSet('offline_bills_queue', q)
      billToast = `Bill #${offNo} queued offline. Will sync when reconnected.`
    }

    if (!isNoPrint) {
      await printBillNow(billSaved)
    }

    if (billOrderType === 'Dine-in' && billTable) {
      activeOrders = activeOrders.filter((ao) => ao.table_name !== billTable)
      saveActiveOrdersStore()
      delete billHeldTables[billTable]
    }
    billCart = []
    billPrintedCart = []
    billKotSeq = 0
    billTokenNo = ''
    curOrderNo = Math.floor(100 + Math.random() * 900)
    billDiscount = 0
    billCashAmount = 0
    billOnlineAmount = 0
    billClientUuid = genClientUuid()
    const panel = $('posCartPanel')
    if (panel) panel.classList.remove('mob-open')
    drawBilling()
    if (navigator.onLine) loadCatalog()
  },

  posprintkot: async () => {
    if (!billCart.length) return
    const diff = computeKotDiff(billCart, billPrintedCart)
    let itemsToPrint = diff
    let isReprint = false
    if (!itemsToPrint.length) {
      if (!confirm('All items in this order were already sent to kitchen. Reprint full KOT?')) return
      itemsToPrint = billCart.map((c) => ({ ...c }))
      isReprint = true
    } else {
      billKotSeq = Number(billKotSeq || 0) + 1
      billPrintedCart = JSON.parse(JSON.stringify(billCart))
    }
    const seq = isReprint ? Math.max(1, billKotSeq) : billKotSeq
    const kotTitle = isReprint ? 'KOT (REPRINT)' : (seq > 1 ? `KOT #${seq} (ADD-ON ITEMS)` : `KITCHEN ORDER (KOT #${seq})`)
    if (billOrderType === 'Dine-in' && billTable) {
      await A.possavetableorder()
    }
    await printKotNow({
      items: itemsToPrint,
      kot_seq: seq,
      kot_title: kotTitle,
      token_no: billTokenNo || curOrderNo,
      table_name: billOrderType === 'Dine-in' ? billTable : billOrderType,
      waiter_name: billWaiter
    })
    billToast = isReprint ? 'KOT reprinted for Kitchen!' : `KOT #${seq} printed for Kitchen!`
    drawBilling()
  },

async function syncOfflineQueue() {
  const q = lsGet('offline_bills_queue', [])
  if (!q.length) return
  let remaining = []
  for (const bill of q) {
    try {
      const res = await fetch('/api/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
        body: JSON.stringify(bill)
      })
      const d = await res.json()
      if (!d.ok && res.status >= 500) remaining.push(bill)
      // If 4xx validation error, drop invalid item instead of looping forever; if 2xx or duplicate, also resolved
    } catch {
      remaining.push(bill)
    }
  }
  lsSet('offline_bills_queue', remaining)
  if (remaining.length === 0) {
    billToast = 'All offline bills synced to cloud!'
    if (page === 'Billing' && window.innerWidth > 768) drawBilling()
    else if (window.innerWidth <= 768 && typeof showMobToast === 'function') showMobToast('Offline bills synced')
  }
}

function getMobItemStockLimit(prod, variant, currentCart, excludeUid) {
  if (!prod || !prod.track_stock) return Infinity
  const vars = prod.variants || []
  const sumVarStock = vars.reduce((s, v) => s + Math.max(0, Number(v.stock || 0)), 0)
  const prodStock = Math.max(0, Number(prod.stock || 0))
  const isSharedPool = vars.length > 1 && prodStock > 0 && sumVarStock === 0
  const usedSameItem = currentCart
    .filter((x) => x.uid !== excludeUid && String(x.product_id) === String(prod.id))
    .reduce((s, x) => s + Number(x.qty || 0), 0)
  const usedSameVar = currentCart
    .filter((x) => x.uid !== excludeUid && String(x.product_id) === String(prod.id) && String(x.variant_id || '') === String((variant && variant.id) || ''))
    .reduce((s, x) => s + Number(x.qty || 0), 0)
  if (isSharedPool) {
    return { maxForRow: Math.max(0, prodStock - usedSameItem), totalCap: prodStock }
  }
  const varCap = variant ? Math.max(0, Number(variant.stock ?? 0)) : prodStock
  return { maxForRow: Math.max(0, varCap - usedSameVar), totalCap: varCap }
}

  if (p.track_stock && totalStock <= 0) {
    return showMobToast(p.name + ' is out of stock')
  }
  if (vars.length > 1) {
    mobSheet = { t: 'pick', id: p.id, prod: p }
    syncMobSheetOverlayDom()
  } else {
    mobAddProd(p, 0)
  }
}

function mobAddProd(prod, vi) {
  const v = (prod.variants && prod.variants[vi]) || { id: prod.id, name: '', price: 0, stock: 0 }
  if (prod.track_stock) {
    const { maxForRow, totalCap } = getMobItemStockLimit(prod, v, billCart, null)
    if (totalCap <= 0) return showMobToast((v.name ? prod.name + ' (' + v.name + ')' : prod.name) + ' is out of stock')
    if (maxForRow < 1) return showMobToast(`Only ${totalCap} in stock`)
  }
  const uid = String(prod.id) + '-' + String(v.id || v.name || 'default')
  const existing = billCart.find((x) => x.uid === uid && !x.note)
  if (existing) {
    existing.qty++
  } else {
    const label = v.name && (prod.variants || []).length > 1 ? `${prod.name} (${v.name})` : prod.name
    billCart.push({
      uid,
      product_id: prod.id,
      variant_id: v.id || null,
      id: prod.id,
      name: label,
      price: Number(v.price || 0),
      qty: 1,
      variant: v.name || '',
      note: ''
    })
  }
  const hadPickSheet = mobSheet && mobSheet.t === 'pick'
  mobSheet = null
  if (hadPickSheet) syncMobSheetOverlayDom()
  showMobToast(prod.name + ' added')
  // Surgical DOM update only: preserve scroll position of the product list (<main>)
  if (window.innerWidth <= 768 && mobTab === 'bill' && $('mobBillList')) {
    updateMobProductCardBadge(prod.id)
    updateMobCartBarDom()
  } else if (window.innerWidth <= 768) {
    renderMobile()
  }
  if (page === 'Billing' && window.innerWidth > 768) drawBilling()
}

function commitMobQty(uid, desiredQty) {
  const item = billCart.find((x) => x.uid === uid)
  if (!item) return
  let qty = parseInt(desiredQty, 10)
  if (!Number.isFinite(qty) || qty <= 0) {
    // Restore previous valid quantity cleanly without deleting item
    syncCartRowDom(item)
    return
  }
  const p = (catalog.products || []).find((x) => String(x.id) === String(item.product_id))
  if (p && p.track_stock) {
    const v = (p.variants || []).find((vx) => String(vx.id) === String(item.variant_id))
    const { maxForRow, totalCap } = getMobItemStockLimit(p, v, billCart, item.uid)
    if (qty > maxForRow) {
      qty = Math.max(1, maxForRow)
      showMobToast(`Only ${totalCap} in stock`)
    }
  }
  item.qty = qty
  syncCartRowDom(item)
}

async function mobPrintKot() {
  if (!billCart.length) return showMobToast('Add items to print KOT')
  const diff = computeKotDiff(billCart, billPrintedCart)
  let itemsToPrint = diff
  let isReprint = false
  if (!itemsToPrint.length) {
    if (!confirm('All current items were already sent to kitchen. Reprint full KOT?')) return
    itemsToPrint = billCart.map((c) => ({ ...c }))
    isReprint = true
  } else {
    billKotSeq = Number(billKotSeq || 0) + 1
    billPrintedCart = JSON.parse(JSON.stringify(billCart))
  }
  const seq = isReprint ? Math.max(1, billKotSeq) : billKotSeq
  const kotTitle = isReprint ? 'KOT (REPRINT)' : (seq > 1 ? `KOT #${seq} (ADD-ON ITEMS)` : `KITCHEN ORDER (KOT #${seq})`)
  if (billOrderType === 'Dine-in' && billTable) {
    await mobHoldTableOrder()
  }
  const mode = await printKotNow({
    items: itemsToPrint,
    kot_seq: seq,
    kot_title: kotTitle,
    token_no: billTokenNo || curOrderNo,
    table_name: billOrderType === 'Dine-in' ? billTable : billOrderType,
    waiter_name: billWaiter
  })
  showMobToast(isReprint ? `KOT reprinted (${mode === 'bt' ? 'BT' : 'Print'})` : `KOT #${seq} sent (${mode === 'bt' ? 'BT' : 'Print'})`)
  renderMobile()
}

async function mobFinishOrder(noPrint) {
  if (!billCart.length) return showMobToast('Add items first')
  if (billSubmitting) return
  const totals = calcOrderTotals(billCart, billDiscount, settingsCache.tax_percent || 0)
  let cashAmt = 0
  let onlineAmt = 0
  if (billPayment === 'Cash') {
    cashAmt = totals.total
  } else if (billPayment === 'Online / Card') {
    onlineAmt = totals.total
  } else if (billPayment === 'Split') {
    cashAmt = Math.max(0, Number(billCashAmount || 0))
    onlineAmt = Math.max(0, Number(billOnlineAmount || 0))
    if (Math.abs((cashAmt + onlineAmt) - totals.total) > 1) {
      return showMobToast(`Split Cash + Online (${rs(cashAmt + onlineAmt)}) must equal Total (${rs(totals.total)})`)
    }
  }

  billSubmitting = true
  renderMobile()

  const payload = {
    id: billClientUuid || genClientUuid(),
    order_type: billOrderType,
    table_name: billOrderType === 'Dine-in' ? billTable : '',
    waiter_name: billWaiter || '',
    guests: billOrderType === 'Dine-in' ? Math.max(1, Number(billGuests || 1)) : 1,
    tax_percent: totals.taxPct,
    subtotal: totals.subtotal,
    discount: totals.discount,
    tax: totals.tax,
    total: totals.total,
    payment_method: billPayment,
    cash_amount: cashAmt,
    online_amount: onlineAmt,
    token_no: billTokenNo || '',
    items: billCart.map((i) => ({
      product_id: i.product_id || null,
      variant_id: i.variant_id || null,
      name: i.name,
      price: Number(i.price || 0),
      qty: Math.max(1, Number(i.qty || 1)),
      note: i.note || ''
    }))
  }

  const r = await api('/api/orders', payload)
  billSubmitting = false

  if (r && r.ok && r.bill) {
    lastBillId = r.bill.id
    if (!noPrint) await printBillNow(r.bill)
    showMobToast(noPrint ? `Bill #${pad(r.bill.bill_no)} saved` : `Bill #${pad(r.bill.bill_no)} saved & printed`)
  } else if (r && !r.offline && r.status && r.status >= 400 && r.status < 500) {
    renderMobile()
    return showMobToast(r.message || 'Could not save bill')
  } else {
    const offNo = Math.floor(Math.random() * 8999) + 1000
    const offBill = { bill_no: offNo, created_at: new Date().toLocaleString(), ...payload }
    const q = lsGet('offline_bills_queue', [])
    if (!q.some((x) => x.id === payload.id)) q.push(payload)
    lsSet('offline_bills_queue', q)
    if (!noPrint) await printBillNow(offBill)
    showMobToast(`Offline Bill #${offNo} queued for sync`)
  }

  if (billOrderType === 'Dine-in' && billTable) {
    activeOrders = activeOrders.filter((ao) => ao.table_name !== billTable)
    saveActiveOrdersStore()
    delete billHeldTables[billTable]
  }
  billCart = []
  billPrintedCart = []
  billKotSeq = 0
  billTokenNo = ''
  billDiscount = 0
  billCashAmount = 0
  billOnlineAmount = 0
  billClientUuid = genClientUuid()
  curOrderNo = Math.floor(100 + Math.random() * 900)
  mobSheet = null
  renderMobile()

  // Refresh stock and dashboard silently in background
  if (navigator.onLine) {
    loadCatalog().then(() => { if (mobTab === 'bill') renderMobile() })
    mobDashData = null
  }
}

async function mobReprintBillById(billId, billNo) {
  if (!billId) return showMobToast('No recent bill to reprint')
  const cached = mobReportsData && (mobReportsData.bills || []).find((b) => String(b.id) === String(billId))
  if (cached && cached.items) {
    await printBillNow(cached)
    return showMobToast(`Bill #${pad(cached.bill_no)} printed`)
  }
  showMobToast('Loading bill #' + pad(billNo || '') + '...')
  const r = await api('/api/orders/' + encodeURIComponent(billId))
  if (!r || !r.ok || !r.bill) return showMobToast((r && r.message) || 'Could not load bill')
  await printBillNow(r.bill)
  showMobToast(`Bill #${pad(r.bill.bill_no)} printed`)
}

function getMobileReportRange() {
  const t = today()
  if (mobPer === 'Weekly') return { from: addDays(t, -6), to: t }
  if (mobPer === 'Monthly') return { from: t.slice(0, 7) + '-01', to: t }
  if (mobPer === 'Yearly') return { from: t.slice(0, 4) + '-01-01', to: t.slice(0, 4) + '-12-31' }
  if (mobPer === 'Custom') return { from: mobCustomFrom || t, to: mobCustomTo || t }
  return { from: t, to: t }
}

async function loadMobileDashboard(silent) {
  if (mobDashLoading) return
  mobDashLoading = true
  const t = today()
  if (!mobDashData && !silent) renderMobile()
  try {
    const [d] = await Promise.all([
      api(`/api/report?from=${t}&to=${t}`),
      loadCatalog()
    ])
    if (d && d.ok) {
      mobDashData = d
      if (mobTab === 'dash') renderMobile()
    }
  } finally {
    mobDashLoading = false
  }
}

async function loadMobileReports(silent) {
  const { from, to } = getMobileReportRange()
  if (!/^\d{4}-\d{2}-\d{2}$/.test(from) || !/^\d{4}-\d{2}-\d{2}$/.test(to) || from > to) {
    return showMobToast('Choose a valid date range (From <= To)')
  }
  mobReportsLoading = true
  if (!silent) renderMobile()
  try {
    const d = await api(`/api/report?from=${from}&to=${to}&bills=1`)
    if (d && d.ok) {
      mobReportsData = d
      mobDailyBills = d.bills || []
    } else {
      showMobToast((d && d.message) || 'Could not load reports')
    }
  } finally {
    mobReportsLoading = false
  }
  if (mobTab === 'rep') renderMobile()
}

function exportMobileCsv() {
  if (!mobReportsData) return showMobToast('No report loaded yet')
  const d = mobReportsData
  const r = getMobileReportRange()
  const q = (s) => `"${String(s ?? '').replace(/"/g, '""')}"`
  const lines = [
    `Report,${r.from} to ${r.to}`,
    `Total sales,${(d.summary && d.summary.sales) || 0}`,
    `Customers,${(d.summary && d.summary.guests) || 0}`,
    `Items sold,${(d.summary && d.summary.items_sold) || 0}`,
    ...(d.payments || []).map((p) => `${q(p.method + ' payments')},${p.total}`),
    '',
    'Bill ID,Date,Time,Type,Table,Waiter,Items,Payment,Status,Amount',
    ...(d.bills || []).map((b) => [
      pad(b.bill_no),
      String(b.created_at || '').slice(0, 10),
      String(b.created_at || '').slice(11, 16),
      q(b.order_type),
      q(b.table_name),
      q(b.waiter_name),
      q((b.items || []).map((i) => `${i.name} x ${i.qty}`).join('; ')),
      q(b.payment_method),
      b.is_void ? 'VOIDED' : 'PAID',
      b.total
    ].join(','))
  ]
  const a = document.createElement('a')
  a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/csv' }))
  a.download = `sales-${r.from}-to-${r.to}.csv`
  a.click()
  showMobToast('CSV report exported')
}

function mobBillListHtml() {

        <div style="flex:1;min-width:0">

  const periods = ['Daily', 'Weekly', 'Monthly', 'Yearly', 'Custom']
  const d = mobReportsData
  const s = (d && d.summary) || { sales: 0, guests: 0, items_sold: 0, bills: 0 }
  const payments = (d && d.payments) || []
  const bills = (d && d.bills) || []
  const { from, to } = getMobileReportRange()
  const cashTotal = (payments.find((p) => String(p.method || '').toLowerCase().includes('cash')) || {}).total || 0
  const onlineTotal = payments.filter((p) => !String(p.method || '').toLowerCase().includes('cash')).reduce((acc, p) => acc + Number(p.total || 0), 0)

  return `
    <div class="row sp" style="margin-bottom:8px">
      <h2 style="margin:0">Sales Reports</h2>
      <button class="btn s o" data-a="mobexportcsv">Export CSV</button>
    </div>

    <div class="chips" style="padding-bottom:6px">
      ${periods.map((p) => `<button class="chip ${mobPer === p ? 'on' : ''}" data-a="mobsetperiod" data-p="${p}">${p}</button>`).join('')}
    </div>

    ${mobPer === 'Custom' ? `
      <div class="card">
        <div class="row" style="gap:8px">
          <div style="flex:1"><div class="mu" style="margin-bottom:3px">From</div><input type="date" id="mobRepFrom" value="${esc(mobCustomFrom)}"></div>
          <div style="flex:1"><div class="mu" style="margin-bottom:3px">To</div><input type="date" id="mobRepTo" value="${esc(mobCustomTo)}"></div>
        </div>
        <button class="btn" data-a="mobapplycustomrep" style="margin-top:8px;padding:10px">Load Date Range</button>
      </div>
    ` : `<div class="mu" style="margin-bottom:8px">Showing: ${from === to ? from : from + ' to ' + to}</div>`}

    ${mobReportsLoading && !d ? `<div class="card mu" style="text-align:center;padding:30px">Loading reports...</div>` : `
      <div class="grid">
        <div class="stat"><div class="mu">Total Sales</div><b>${rs(s.sales)}</b></div>
        <div class="stat"><div class="mu">Customers</div><b>${Number(s.guests || 0)}</b></div>
        <div class="stat"><div class="mu">Items Sold</div><b>${Number(s.items_sold || 0)}</b></div>
        <div class="stat"><div class="mu">Total Bills</div><b>${Number(s.bills || bills.length || 0)}</b></div>
      </div>
      <div class="grid" style="margin-top:10px">
        <div class="stat"><div class="mu">Cash</div><b style="font-size:17px">${rs(cashTotal)}</b></div>
        <div class="stat"><div class="mu">Online / Card</div><b style="font-size:17px">${rs(onlineTotal)}</b></div>
      </div>

      <h3>Bill History (${bills.length})</h3>
      ${bills.length ? bills.map((b) => `
        <div class="card" style="${b.is_void ? 'opacity:.65;border-color:#FCA5A5' : ''}">
          <div class="row sp" style="margin-bottom:4px">

            </div>
            <b style="color:var(--br)">${rs(b.total)}</b>
          </div>
          <div class="mu">${esc(String(b.created_at || '').slice(0, 16))} • ${esc(b.order_type || 'Dine-in')}${b.table_name ? ' (' + esc(b.table_name) + ')' : ''}${b.waiter_name ? ' • ' + esc(b.waiter_name) : ''} • ${esc(b.payment_method || 'Cash')}</div>
