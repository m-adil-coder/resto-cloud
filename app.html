function renderMobileSheetHtml() {
  const o = mobSheet
  if (!o) return ''

  const wrap = (body) => `
    <div class="ov" id="mobSheetOverlay">
      <div class="sheet">
        ${body}
      </div>
    </div>
  `

  if (o.t === 'pick') {
    const p = o.prod || (catalog.products || []).find(x => x.id === o.id) || { name: 'Item', variants: [] }
    return wrap(`
      <h2>${esc(p.name)}</h2>
      <div style="font-size:12px;color:var(--mu);margin-bottom:12px">Select size / option:</div>
      ${(p.variants || []).map((v, i) => `
        <button class="lr" data-a="mobaddvar" data-pid="${esc(p.id)}" data-vi="${i}">
          <span style="flex:1;font-weight:700">${esc(v.name || 'Standard')}</span>
          <b style="color:var(--br)">${rs(v.price)}</b>
        </button>
      `).join('')}
      <button class="btn o" style="margin-top:10px" data-a="mobclosesheet">Cancel</button>
    `)
  }

  if (o.t === 'cart') {
    const subtotal = billCart.reduce((s, i) => s + i.qty * i.price, 0)
    const taxPct = Number(settingsCache.tax_percent || 0)
    const taxable = Math.max(0, subtotal - billDiscount)
    const tax = taxPct > 0 ? (taxable * (taxPct / 100)) : 0
    const total = Math.max(0, taxable + tax)

    return wrap(`
      <h2>Your order${billOrderType === 'Dine-in' && billTable ? ' · ' + esc(billTable) : ''}</h2>
      ${billCart.map(l => `
        <div class="row sp" style="margin-bottom:12px;align-items:flex-start">
          <div style="flex:1;min-width:0;padding-right:8px">
            <b style="font-size:14.5px;color:var(--tx)">${esc(l.name)}</b>
            <div class="mu">${rs(l.price)} each</div>
            ${l.note ? `
              <div style="font-size:11.5px;color:var(--br);font-weight:700;margin-top:3px">
                ${esc(l.note).split('\n').map(x => x.trim()).filter(Boolean).join(' · ')}
              </div>
            ` : ''}
            <button class="btn s o" data-a="mobopennotemodal" data-uid="${esc(l.uid)}" style="padding:3px 8px;font-size:11px;margin-top:4px">
              ${l.note ? '✏️ Edit Note' : '+ Note / Pack'}
            </button>
          </div>
          <div class="q">
            <button data-a="mobqty" data-uid="${esc(l.uid)}" data-delta="-1">−</button>
            <b>${l.qty}</b>
            <button data-a="mobqty" data-uid="${esc(l.uid)}" data-delta="1">+</button>
          </div>
        </div>
      `).join('')}

      <div class="row" style="margin:12px 0">
        <input type="number" inputmode="numeric" placeholder="Discount (Rs)" value="${billDiscount || ''}" onchange="billDiscount=+this.value||0;renderMobile()">
      </div>

      <div class="seg">
        ${['Cash', 'Online', 'Card'].map(m => `
          <button class="${billPayment === m ? 'on' : ''}" onclick="billPayment='${m}';renderMobile()">${m}</button>
        `).join('')}
      </div>

      <div class="row sp mu"><span>Subtotal</span><span>${rs(subtotal)}</span></div>
      ${billDiscount ? `<div class="row sp mu"><span>Discount</span><span>− ${rs(billDiscount)}</span></div>` : ''}
      ${tax > 0 ? `<div class="row sp mu"><span>Tax (${taxPct}%)</span><span>${rs(tax)}</span></div>` : ''}
      <div class="row sp" style="font-size:20px;font-weight:800;margin:6px 0 14px">
        <span>Total</span><span>${rs(total)}</span>
      </div>

      <button class="btn" data-a="mobfinish" data-print="1">🖨 Print final bill</button>
      <div class="grid" style="margin:10px 0">
        <button class="btn g" data-a="mobhold">Save table order</button>
        <button class="btn o" data-a="mobprintkot">Print KOT</button>
      </div>
      <button class="btn o" data-a="mobfinish" data-print="0">Save without printing</button>
      <button class="btn d" style="margin-top:10px" data-a="mobclearorder">Clear order</button>
    `)
  }

  if (o.t === 'prn') {
    return wrap(`
      <h2>Bluetooth Thermal Printer</h2>
      <div class="card row sp">
        <div>
          <b>${esc(btPrinterName || 'POS Thermal Printer')}</b>
          <div class="mu">${btCharacteristic ? 'Connected · ' + btPrinterWidth + 'mm' : 'Not connected'}</div>
        </div>
        <span class="dot" style="background:${btCharacteristic ? 'var(--ok)' : 'var(--bad)'}"></span>
      </div>

      <div style="margin:12px 0">
        <label class="mu">Printer Paper Width:</label>
        <select class="inp" style="margin-top:4px" onchange="btPrinterWidth=this.value;localStorage.setItem('bt_printer_width', this.value);renderMobile()">
          <option value="58" ${btPrinterWidth === '58' ? 'selected' : ''}>58mm Thermal Paper</option>
          <option value="80" ${btPrinterWidth === '80' ? 'selected' : ''}>80mm Thermal Paper</option>
        </select>
      </div>

      <button class="btn ${btCharacteristic ? 'o' : ''}" data-a="mobtogglebt">
        ${btCharacteristic ? 'Disconnect Printer' : 'Scan and connect printer'}
      </button>

      <button class="btn o" style="margin-top:10px" data-a="mobtoggletestbt">
        Print test slip
      </button>

      <button class="btn o" style="margin-top:10px" data-a="mobclosesheet">Close</button>
    `)
  }

  if (o.t === 'prof') {
    return wrap(`
      <h2>Restaurant & Receipt</h2>
      ${[
        ['Restaurant name', settingsCache.restaurant_name || 'Restaurant POS', 'restaurant_name'],
        ['Address', settingsCache.address || '', 'address'],
        ['Phone', settingsCache.phone || '', 'phone'],
        ['Tax (%) added to every bill', settingsCache.tax_percent || 0, 'tax_percent'],
        ['Message at bottom of bill', settingsCache.footer || 'Thank you! Visit again.', 'footer']
      ].map(f => `
        <label class="mu">${f[0]}</label>
        <input id="set_${f[2]}" value="${esc(f[1])}" style="margin:4px 0 10px" ${f[2] === 'tax_percent' ? 'type="number"' : ''}>
      `).join('')}
      <button class="btn" data-a="mobsaveprof">Save settings</button>
      <button class="btn o" style="margin-top:8px" data-a="mobclosesheet">Cancel</button>
    `)
  }

  if (o.t === 'wait') {
    return wrap(`
      <h2>Waiters</h2>
      <div class="row" style="margin-bottom:10px">
        <input id="mobNewWaiterInp" placeholder="New waiter name">
        <button class="btn s" data-a="mobaddwaiter">Add</button>
      </div>
      ${(waitersList || []).map(w => {
        const wName = typeof w === 'string' ? w : w.name
        const wId = typeof w === 'object' ? w.id : w
        return `
          <div class="card row sp">
            <b>🧑‍🍳 ${esc(wName)}</b>
            <button class="btn d s" data-a="mobdelwaiter" data-id="${esc(wId)}">Delete</button>
          </div>
        `
      }).join('')}
      <button class="btn o" style="margin-top:10px" data-a="mobclosesheet">Done</button>
    `)
  }

  if (o.t === 'tabs') {
    const defaultTables = ['Table 1', 'Table 2', 'Table 3', 'Table 4', 'Table 5', 'Table 6', 'Table 7', 'Table 8', 'Table 9', 'Table 10']
    const tables = (tablesList && tablesList.length) ? tablesList.map(t => typeof t === 'string' ? t : t.name) : defaultTables
    return wrap(`
      <h2>Dine-in Tables</h2>
      <div class="row" style="margin-bottom:10px">
        <input id="mobNewTableInp" placeholder="e.g. Table 11, VIP Lounge">
        <button class="btn s" data-a="mobaddtable">Add</button>
      </div>
      <div class="grid">
        ${tables.map(t => `
          <div class="card row sp" style="margin:0;padding:10px">
            <b>${esc(t)}</b>
            <button class="btn d s" data-a="mobdeltable" data-name="${esc(t)}" style="padding:2px 8px;font-size:11px">✕</button>
          </div>
        `).join('')}
      </div>
      <button class="btn o" style="margin-top:12px" data-a="mobclosesheet">Done</button>
    `)
  }

  if (o.t === 'users') {
    const users = (staffData && staffData.users) || (staff && staff.users) || []
    return wrap(`
      <h2>Users & Staff</h2>
      <div class="card" style="margin-bottom:14px;padding:12px">
        <b style="font-size:13px;text-transform:uppercase;color:var(--mu);display:block;margin-bottom:8px">Create Cashier Account</b>
        <div style="display:grid;gap:8px">
          <input id="mobStaffName" placeholder="Full name (e.g. Ali Raza)">
          <input id="mobStaffEmail" placeholder="Login username or email">
          <input id="mobStaffPassword" type="password" placeholder="Password (min 4 characters)">
          <button class="btn s" data-a="mobsubmitaddstaff" style="padding:10px">Create Cashier Account</button>
        </div>
      </div>

      <b class="mu" style="display:block;margin-bottom:8px">Existing Accounts (${users.length})</b>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${users.map(u => `
          <div class="card row sp" style="margin:0;padding:12px">
            <div>
              <b>${esc(u.name)}</b>
              <div class="mu">${esc(u.email || u.username || 'Cashier')} · <span style="color:var(--ok)">Active</span></div>
            </div>
            ${u.role !== 'admin' ? `
              <button class="btn d s" data-a="mobdelstaff" data-id="${esc(u.id)}" data-name="${esc(u.name)}" style="padding:4px 10px;font-size:11px">Delete</button>
            ` : '<span class="tag">Owner</span>'}
          </div>
        `).join('')}
      </div>
      <button class="btn o" style="margin-top:14px" data-a="mobclosesheet">Close</button>
    `)
  }

  if (o.t === 'void') {
    return wrap(`
      <h2>Void bill #${pad(o.no)}?</h2>
      <p class="mu" style="margin-bottom:14px">This removes the bill from sales totals. This cannot be undone.</p>
      <button class="btn d" data-a="mobvoidbill" data-id="${esc(o.id || '')}" data-no="${o.no}">Void bill</button>
      <button class="btn o" style="margin-top:8px" data-a="mobclosesheet">Keep bill</button>
    `)
  }

  if (o.t === 'z') {
    const d = mobReportsData || dashCache || { summary: { sales: 0, guests: 0 } }
    const s = d.summary || { sales: 0, guests: 0 }
    return wrap(`
      <h2>End day · Z-report</h2>
      <div class="card">
        <b>Daily Summary</b><br>
        Total Bills: <b>${s.guests || 0}</b><br>
        Total Sales: <b>${rs(s.sales || 0)}</b>
      </div>
      <button class="btn" data-a="mobprintsummary">Print Z-Report & Summary</button>
      <button class="btn o" style="margin-top:8px" data-a="mobclosesheet">Cancel</button>
    `)
  }

  return ''
}


// ---------------- Master Mobile View Renderer ----------------
function renderMobile(keepInputFocus) {
  const mobApp = $('mobApp')
  if (!mobApp) return

  if (window.innerWidth > 768) {
    mobApp.style.display = 'none'
    const shell = $('shell')
    if (shell) shell.hidden = false
    return
  }

  mobApp.style.display = 'flex'
  const shell = $('shell')
  if (shell) shell.hidden = true

  const shopName = settingsCache.restaurant_name || (me && me.restaurant && me.restaurant.name) || 'Restaurant POS'
  const userName = (me && me.name) || 'Staff'
  const userRole = (me && me.role) || 'Cashier'
  const isOnline = navigator.onLine

  const totalQty = billCart.reduce((s, i) => s + i.qty, 0)
  const subtotal = billCart.reduce((s, i) => s + i.qty * i.price, 0)
  const taxPct = Number(settingsCache.tax_percent || 0)
  const taxable = Math.max(0, subtotal - billDiscount)
  const tax = taxPct > 0 ? (taxable * (taxPct / 100)) : 0
  const total = Math.max(0, taxable + tax)

  const bodyHtml = {
    bill: renderMobileBilling,
    dash: renderMobileDashboard,
    prods: renderMobileProducts,
    reps: renderMobileReports,
    more: renderMobileMore
  }[mobTab]()

  const activeId = document.activeElement ? document.activeElement.id : null
  const selStart = document.activeElement ? document.activeElement.selectionStart : null

  const licMsg = me && me.license && me.license.message
  const showLic = licMsg && !licMsg.includes('0 day')

  mobApp.innerHTML = `
    <header>
      <div style="flex:1;min-width:0">
        <b>${esc(shopName)}</b>
        <small>${esc(userName)} · ${esc(userRole)}</small>
      </div>
      <div class="pill" data-a="mobopensheet" data-t="prn">
        <span class="dot" style="background:${btCharacteristic ? '#4ADE80' : '#F87171'}"></span>
        ${btCharacteristic ? 'Printer ready' : 'No printer'}
      </div>
      <button class="pill" data-a="mobsync">
        ${isOnline ? 'Synced' : 'Offline'}
      </button>
    </header>

    ${showLic ? `
      <div class="sub">${esc(licMsg)}</div>
    ` : ''}

    <main id="mobMain">${bodyHtml}</main>

    ${mobTab === 'bill' && totalQty > 0 && !mobSheet ? `
      <button class="cartbar" data-a="mobopencart">
        <span>View order · ${totalQty} item${totalQty > 1 ? 's' : ''}</span>
        <span>${rs(total)}</span>
      </button>
    ` : ''}

    <nav>
      ${[
        ['bill', '🧾', 'Billing'],
        ['dash', '📊', 'Dashboard'],
        ['prods', '🍔', 'Products'],
        ['reps', '📈', 'Reports'],
        ['more', '☰', 'More']
      ].map(t => `
        <button class="${mobTab === t[0] ? 'on' : ''}" data-a="mobtab" data-tab="${t[0]}">
          <span>${t[1]}</span>
          ${t[2]}
        </button>
      `).join('')}
    </nav>

    ${renderMobileSheetHtml()}
    ${mobToast ? `<div class="toast">${esc(mobToast)}</div>` : ''}
  `

  if (keepInputFocus && activeId) {
    const el = document.getElementById(activeId)
    if (el) {
      el.focus()
      if (selStart !== null) el.setSelectionRange(selStart, selStart)
    }
  }
}

// ---------------- Action Handlers Mapping ----------------
Object.assign(A, {
  mobtab: async (d) => {
    mobTab = d.tab
    renderMobile()
    if (mobTab === 'dash') await loadMobileDashboard()
    if (mobTab === 'reps') await loadMobileReports()
    if (mobTab === 'prods') await loadCatalog()
    if (mobTab === 'more') await loadStaff()
    renderMobile()
  },
  mobcat: (d) => { mobCat = d.cat; renderMobile(); },
  mobpickprod: (d) => { mobPickProd(d.id); },
  mobaddvar: (d) => {
    const p = (catalog.products || []).find(x => x.id === d.pid || String(x.id) === String(d.pid))
    if (p) mobAddProd(p, Number(d.vi))
  },
  mobqty: (d) => { mobChangeQty(d.uid, Number(d.delta)); },
  mobopencart: () => { mobSheet = { t: 'cart' }; renderMobile(); },
  mobclosesheet: () => { mobSheet = null; renderMobile(); },
  mobfinish: (d) => { mobFinishOrder(d.print === '1'); },
  mobhold: () => { mobHoldTableOrder(); },
  mobprintkot: () => { mobPrintKot(); },
  mobclearorder: () => {
    billCart = []
    mobSheet = null
    showMobToast('Order cleared')
    renderMobile()
    if (page === 'Billing') drawBilling()
  },
  mobordertype: (d) => { billOrderType = d.t; renderMobile(); },
  mobpicktable: (d) => { mobPickTable(d.t); },
  mobopensheet: (d) => { mobSheet = { t: d.t, no: d.no, id: d.id }; renderMobile(); },
  mobdarktoggle: () => {
    const isDark = document.documentElement.dataset.theme === 'dark'
    document.documentElement.dataset.theme = isDark ? 'light' : 'dark'
    localStorage.setItem('theme', isDark ? 'light' : 'dark')
    renderMobile()
  },
  mobsync: async () => {
    await syncOfflineQueue()
    showMobToast('Synced with cloud')
    renderMobile()
  },
  mobtogglebt: async () => {
    if (btCharacteristic) {
      disconnectBtPrinter()
    } else {
      await connectBtPrinter()
    }
    renderMobile()
  },
  mobtoggletestbt: async () => {
    await printTestSlip()
    showMobToast('Test slip printed')
  },
  mobsaveprof: async () => {
    const nameEl = $('set_restaurant_name')
    const addrEl = $('set_address')
    const phoneEl = $('set_phone')
    const taxEl = $('set_tax_percent')
    const footEl = $('set_footer')
    if (nameEl) settingsCache.restaurant_name = nameEl.value
    if (addrEl) settingsCache.address = addrEl.value
    if (phoneEl) settingsCache.phone = phoneEl.value
    if (taxEl) settingsCache.tax_percent = Number(taxEl.value) || 0
    if (footEl) settingsCache.footer = footEl.value
    await api('/api/settings', settingsCache, 'POST')
    mobSheet = null
    showMobToast('Settings saved')
    renderMobile()
  },
  mobaddwaiter: async () => {
    const inp = $('mobNewWaiterInp')
    if (inp && inp.value.trim()) {
      const name = inp.value.trim()
      await api('/api/waiters', { name }, 'POST')
      await loadBillingData()
      showMobToast('Waiter added')
      renderMobile()
    }
  },
  mobdelwaiter: async (d) => {
    await api('/api/waiters/' + d.id, undefined, 'DELETE')
    await loadBillingData()
    showMobToast('Waiter removed')
    renderMobile()
  },
  mobaddtable: async () => {
    const inp = $('mobNewTableInp')
    if (inp && inp.value.trim()) {
      tablesList.push(inp.value.trim())
      localStorage.setItem('custom_tables_list', JSON.stringify(tablesList))
      showMobToast('Table added')
      renderMobile()
    }
  },
  mobdeltable: (d) => {
    tablesList = tablesList.filter(t => (typeof t === 'string' ? t : t.name) !== d.name)
    localStorage.setItem('custom_tables_list', JSON.stringify(tablesList))
    showMobToast('Table deleted')
    renderMobile()
  },
  mobsubmitaddstaff: async () => {
    const name = $('mobStaffName') ? $('mobStaffName').value.trim() : ''
    const email = $('mobStaffEmail') ? $('mobStaffEmail').value.trim() : ''
    const pw = $('mobStaffPassword') ? $('mobStaffPassword').value : ''
    if (!name) return showMobToast('Enter staff name')
    if (!email) return showMobToast('Enter login username or email')
    if (!pw || pw.length < 4) return showMobToast('Password must be at least 4 chars')
    const r = await api('/api/users', { name, email: email.toLowerCase(), password: pw, role: 'cashier' })
    if (r.ok) {
      await loadStaff()
      showMobToast('Staff account created!')
      renderMobile()
    } else {
      showMobToast(r.message || 'Failed to add staff')
    }
  },
  mobdelstaff: async (d) => {
    if (!confirm(`Delete staff member "${d.name}"?`)) return
    const r = await api('/api/users/' + d.id, undefined, 'DELETE')
    if (r.ok) {
      await loadStaff()
      showMobToast('Staff removed')
      renderMobile()
    } else {
      showMobToast(r.message || 'Failed to delete staff')
    }
  },
  mobopencat: (d) => {
    mobProdCat = d.id
    mobProdSearch = ''
    renderMobile()
  },
  mobbackcat: () => {
    mobProdCat = null
    mobProdSearch = ''
    renderMobile()
  },
  mobaddcategory: async () => {
    const inp = $('mobNewCatInp')
    if (!inp || !inp.value.trim()) return showMobToast('Enter category name')
    const name = inp.value.trim()
    const r = await api('/api/categories', { name }, 'POST')
    if (r.ok) {
      await loadCatalog()
      showMobToast('Category added')
      renderMobile()
    } else {
      showMobToast(r.message || 'Failed to add category')
    }
  },
  mobrencat: async (d) => {
    const name = prompt('Rename category:', d.name)
    if (!name || !name.trim() || name.trim() === d.name) return
    const r = await api('/api/categories/' + d.id, { name: name.trim() }, 'PUT')
    if (r.ok) {
      await loadCatalog()
      showMobToast('Category renamed')
      renderMobile()
    } else {
      showMobToast(r.message || 'Rename failed')
    }
  },
  mobdelcat: async (d) => {
    if (!confirm(`Delete category "${d.name}" and all items inside it?`)) return
    const r = await api('/api/categories/' + d.id, undefined, 'DELETE')
    if (r.ok) {
      mobProdCat = null
      await loadCatalog()
      showMobToast('Category deleted')
      renderMobile()
    } else {
      showMobToast(r.message || 'Delete failed')
    }
  },
  mobaddprod: () => {
    openProduct(null)
  },
  mobeditprod: (d) => {
    const p = (catalog.products || []).find(x => x.id === d.id)
    if (p) openProduct(p)
  },
  mobdelprod: async (d) => {
    if (!confirm(`Delete product "${d.name}"?`)) return
    const r = await api('/api/products/' + d.id, undefined, 'DELETE')
    if (r.ok) {
      await loadCatalog()
      showMobToast('Product deleted')
      renderMobile()
    } else {
      showMobToast(r.message || 'Delete failed')
    }
  },
  moblogout: () => {
    logout()
  }
})// Auto sync on resize between Desktop and Mobile
window.addEventListener('resize', () => {
  if (window.innerWidth <= 768) {
    renderMobile()
  } else {
    const mobApp = $('mobApp')
    if (mobApp) mobApp.style.display = 'none'
    const shell = $('shell')
    if (shell) shell.hidden = false
  }
})

</script>
</body>
</html>
